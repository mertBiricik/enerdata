        .content-layout {

        .filter-group {

        .filter-group label {

        .year-range-container {

        .year-inputs {

        .year-inputs input {

            text-align: center;

        .year-inputs span {

        #yearRangeSlider {

        #yearRangeSlider .noUi-handle {

        .type-selector {
            margin-bottom: 1.5rem;
        }
        
        .type-options {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #006400;
            background: #f0f0f0;
            width: 100%;

        .type-options label {
            padding: 0.8rem 1rem;
            margin: 0;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #006400;
            transition: all 0.2s ease;
            border-right: 1px solid #006400;
            flex: 1;
        }
        
        .type-options label:last-child {
            border-right: none;
        }
        
        .type-options input[type="radio"] {
            display: none;
        }
        
        .type-options input[type="radio"]:checked + label {
            background: #006400;
            color: white;
        }
        
        .series-checkboxes {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: white;
            margin-bottom: 1.5rem;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 0.7rem 1rem;
            border-bottom: 1px solid #f1f3f4;
            transition: background 0.2s ease;
        }
        
        .checkbox-item:hover {
            background: #f8f9fa;
        }
        
        .checkbox-item:last-child {
            border-bottom: none;
        }
        
        .checkbox-item input[type="checkbox"] {
            margin-right: 0.8rem;
            accent-color: #006400;
            transform: scale(1.1);
        }
        
        .checkbox-item label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
            flex: 1;
        }
        
        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .filter-buttons button {
            flex: 1;
            padding: 0.7rem;
            background: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .filter-buttons button:hover {
            background: #006400;
            color: white;
            border-color: #006400;
        }
        
        .search-input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
        }
        
        .tab-button {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-button:hover {
            color: #006400;
            background: #f8f9fa;
        }
        
        .tab-button.active {
            color: #006400;
            border-bottom-color: #006400;
            background: #f8f9fa;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chart-container {
            position: relative;
            height: 500px;
            margin: 1.5rem 0;
            background: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            background: white;
            scrollbar-width: thin;
            scrollbar-color: #006400 #f1f1f1;
        }
        
        .table-container::-webkit-scrollbar {
            height: 12px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: #006400;
            border-radius: 6px;
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #004d00;
        }
        
        .top-scrollbar-container {
            width: 100%;
            height: 12px;
            margin-bottom: 5px;
            overflow: hidden;
            border-radius: 6px;
            background: #f1f1f1;
        }
        
        .top-scrollbar {
            width: 100%;
            height: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #006400 #f1f1f1;
        }
        
        .top-scrollbar::-webkit-scrollbar {
            height: 12px;
        }
        
        .top-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }
        
        .top-scrollbar::-webkit-scrollbar-thumb {
            background: #006400;
            border-radius: 6px;
        }
        
        .top-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #004d00;
        }
        
        .top-scrollbar-thumb {
            height: 1px;
            background: transparent;
        }

        .data-table {
            border-collapse: collapse;
            min-width: 2500px;
            background: white;
        }
        
        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        
        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #006400;
        }
        
        .data-table tbody tr:nth-child(odd) {
            background: #fbfcfd;
        }
        
        .data-table tbody tr:hover {
            background: #f0f8f0;
        }
        
        .sticky-col {
            position: sticky;
            left: 0;
            background: #f8f9fa;
            z-index: 2;
            box-shadow: 2px 0 4px rgba(0,0,0,0.1);
            width: 250px;
            max-width: 250px;
            min-width: 250px;
        }
        
        .red-value {
            color: #dc3545;
            font-style: italic;
        }
        
        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }
        
        .download-buttons button {
            padding: 0.8rem 1.2rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0,100,0,0.2);
        }
        
        .download-buttons button:hover {
            background: #004d00;
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(0,100,0,0.3);
        }

        .chart-download {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }

        .chart-download button {
            padding: 0.8rem 1.5rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0,100,0,0.2);
        }

        .chart-download button:hover {
            background: #004d00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,100,0,0.3);
        }
        
        .calculation-mode {
            margin: 1rem 0;
            padding: 1rem;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .calculation-mode label:first-child {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.8rem;
            text-align: center;
        }
        
        .mode-options {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .mode-options label {
            padding: 0.5rem 1rem;
            margin: 0;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #006400;
            background: white;
            border: 2px solid #006400;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0,100,0,0.1);
            min-width: 80px;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
        }
        
        .mode-options label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,100,0,0.2);
            background: #f0f8f0;
        }
        
        .mode-options input[type="radio"] {
            display: none;
        }
        
        .mode-options input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,100,0,0.3);
        }

            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }

            display: inline-block;
            font-size: 1.5rem;
            margin-right: 0.5rem;

            .content-layout {

            .filters-panel {

                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .year-inputs {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .download-buttons {
                flex-direction: column;
            }
            
            .type-options {
                flex-direction: column;
            }
            
            .type-options label {
                border-right: none;
                border-bottom: 1px solid #006400;
            }
            
            .type-options label:last-child {
                border-bottom: none;
            }

<body>
    <div class="main-container">
        <div class="header">
            <h1>Elektrik Enerjisinin Kaynaklara Göre Kurulu Gücü ve Üretimi</h1>
        </div>
        
        <div class="content-layout">
            <div class="filters-panel">
                <div class="filter-group">
                    <label>Veri Türü</label>
                    <div class="type-selector">
                        <div class="type-options">
                            <input type="radio" id="typeCapacity" name="dataType" value="capacity" checked>
                            <label for="typeCapacity">Kurulu Güç</label>
                            <input type="radio" id="typeProduction" name="dataType" value="production">
                            <label for="typeProduction">Üretim</label>
                        </div>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label>Yıl Aralığı</label>
                    <div class="year-range-container">
                        <div id="yearRangeSlider"></div>
                        <div class="year-inputs">
                            <input type="number" id="yearInputStart" min="1970" max="2023" value="1970">
                            <span>-</span>
                            <input type="number" id="yearInputEnd" min="1970" max="2023" value="2023">
                        </div>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label>Elektrik Kaynakları</label>
                    <input type="text" id="seriesSearch" class="search-input" placeholder="Kaynak ara...">
                    <div class="filter-buttons">
                        <button id="selectAllBtn">Hepsini Seç</button>
                        <button id="deselectAllBtn">Hiçbirini Seçme</button>
                    </div>
                    <div id="seriesCheckboxes" class="series-checkboxes"></div>
                    
                    <div class="download-buttons">
                        <button id="downloadFullData">Tam Veriyi İndir</button>
                        <button id="downloadFilteredData">Filtrelenmiş Veriyi İndir</button>
                    </div>
                </div>
            </div>
            
            <div class="content-panel">
                <div class="tabs">
                    <button class="tab-button active" data-tab="table">Tablo</button>
                    <button class="tab-button" data-tab="line">Çizgi Grafik</button>
                    <button class="tab-button" data-tab="bar">Sütun Grafik</button>
                    <button class="tab-button" data-tab="pie">Pasta Grafik</button>
                </div>
                
                <div id="tableContent" class="tab-content active">
                    <div class="top-scrollbar-container">
                        <div class="top-scrollbar">
                            <div class="top-scrollbar-thumb"></div>
                        </div>
                    </div>
                    <div class="table-container" id="mainTableContainer">
                        <div id="tableContainer"></div>
                    </div>
                </div>
                
                <div id="lineContent" class="tab-content">
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                    <div id="lineLegendContainer" style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-family: 'Segoe UI', Arial, sans-serif; display: none;">
                        <div style="font-weight: bold; margin-bottom: 10px; color: #333;">Veri Serileri:</div>
                        <div id="lineLegendContent" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px;"></div>
                    </div>
                    <div class="chart-download">
                        <button id="downloadLineChart">Çizgi Grafiği İndir</button>
                    </div>
                </div>
                
                <div id="barContent" class="tab-content">
                    <div class="calculation-mode">
                        <label>Hesaplama Türü</label>
                        <div class="mode-options">
                            <input type="radio" id="mode-sum" name="barChartMode" value="sum" checked>
                            <label for="mode-sum">Toplam</label>
                            <input type="radio" id="mode-average" name="barChartMode" value="average">
                            <label for="mode-average">Ortalama</label>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                    <div class="chart-download">
                        <button id="downloadBarChart">Sütun Grafiği İndir</button>
                    </div>
                </div>

                <div id="pieContent" class="tab-content">
                    <div class="calculation-mode">
                        <label>Hesaplama Türü</label>
                        <div class="mode-options">
                            <input type="radio" id="pie-mode-sum" name="pieChartMode" value="sum" checked>
                            <label for="pie-mode-sum">Toplam</label>
                            <input type="radio" id="pie-mode-average" name="pieChartMode" value="average">
                            <label for="pie-mode-average">Ortalama</label>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div id="pieLegendContainer" style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-family: 'Segoe UI', Arial, sans-serif; display: none;">
                        <div style="font-weight: bold; margin-bottom: 10px; color: #333;">Kategori Dağılımı:</div>
                        <div id="pieLegendContent" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px;"></div>
                    </div>
                    <div class="chart-download">
                        <button id="downloadPieChart">Pasta Grafiği İndir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let yearSlider = null;
        let lineChart = null;
        let barChart = null;
        let pieChart = null;
        let currentFilteredData = [];
        let allYears = [];
        let colorIndex = 0;
        let startYear = 1970;
        let endYear = 2023;

        // Diverse color palette for electricity
        const materialColors = [
            '#2196F3', '#FF9800', '#4CAF50', '#F44336', '#9C27B0',
            '#00BCD4', '#CDDC39', '#FF5722', '#795548', '#607D8B',
            '#E91E63', '#3F51B5', '#009688', '#8BC34A', '#FFC107',
            '#673AB7', '#00E676', '#FF6D00', '#37474F', '#B71C1C',
            '#1E88E5', '#FB8C00', '#43A047', '#E53935', '#8E24AA',
            '#26A69A', '#D4E157', '#FF3D00', '#6D4C41', '#546E7A',
            '#AD1457', '#5E35B1', '#00ACC1', '#7CB342', '#FFB300',
            '#512DA8', '#66BB6A', '#FF8F00', '#D32F2F', '#7B1FA2'
        ];

        function getNextMaterialColor() {
            const color = materialColors[colorIndex % materialColors.length];
            colorIndex++;
            return color;
        }

        // Turkish number formatting functions
        function formatTableNumber(value) {
            if (value === null || value === undefined || value === '') return 'N/A';
            return parseFloat(value).toFixed(1);
        }

        function formatGraphNumber(value) {
            if (value === null || value === undefined || value === '') return 'N/A';
            return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function parseRedValue(value) {
            if (value === null || value === undefined) return null;
            if (typeof value === 'string' && value.startsWith('(') && value.endsWith(')')) {
                const numStr = value.slice(1, -1);
                return parseFloat(numStr) || 0;
            }
            return parseFloat(value) || 0;
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', function() {
            // Use embeddedDataB from the included script file
            const data = typeof embeddedDataB !== 'undefined' ? embeddedDataB : [];
            
            if (data.length === 0) {
                showNoDataMessage();
                return;
            }

            console.log('Loaded', data.length, 'data series for Electricity');
            
            // Extract all years from data
            allYears = [];
            data.forEach(item => {
                Object.keys(item).forEach(key => {
                    if (key !== 'Kategori' && !isNaN(parseInt(key))) {
                        const year = parseInt(key);
                        if (!allYears.includes(year)) {
                            allYears.push(year);
                        }
                    }
                });
            });
            allYears.sort((a, b) => a - b);
            
            if (allYears.length > 0) {
                startYear = allYears[0];
                endYear = allYears[allYears.length - 1];
            }

            initializeFilters();
            initializeEventListeners();
            populateSeriesFilter();
            applyFiltersAndRender();
        });

        function showNoDataMessage() {
            document.querySelector('.content-panel').innerHTML = `
                <div class="no-data-message">
                    <h3>⚠️ Veri Yüklenemedi</h3>
                    <p>Elektrik verileri yüklenemedi. Lütfen data/b/data_b_embedded.js dosyasının mevcut olduğunu kontrol edin.</p>
                </div>
            `;
        }

        function initializeFilters() {
            // Initialize year range slider
            const yearRangeSlider = document.getElementById('yearRangeSlider');
            
            noUiSlider.create(yearRangeSlider, {
                start: [startYear, endYear],
                connect: true,
                range: {
                    'min': allYears[0] || 1970,
                    'max': allYears[allYears.length - 1] || 2023
                },
                step: 1,
                format: {
                    to: function(value) {
                        return Math.round(value);
                    },
                    from: function(value) {
                        return Number(value);
                    }
                }
            });

            // Update inputs when slider changes
            yearRangeSlider.noUiSlider.on('update', function(values) {
                startYear = parseInt(values[0]);
                endYear = parseInt(values[1]);
                document.getElementById('yearInputStart').value = startYear;
                document.getElementById('yearInputEnd').value = endYear;
            });

            // Apply filters when slider stops moving
            yearRangeSlider.noUiSlider.on('set', function() {
                applyFiltersAndRender();
            });

            yearSlider = yearRangeSlider;
        }

        function initializeEventListeners() {
            // Year input changes
            document.getElementById('yearInputStart').addEventListener('change', handleYearInputChange);
            document.getElementById('yearInputEnd').addEventListener('change', handleYearInputChange);

            // Tab switching
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });

            // Data type filtering
            document.querySelectorAll('input[name="dataType"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    populateSeriesFilter();
                    applyFiltersAndRender();
                });
            });

            // Filter buttons
            document.getElementById('selectAllBtn').addEventListener('click', function() {
                document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]').forEach(cb => {
                    cb.checked = true;
                });
                applyFiltersAndRender();
            });

            document.getElementById('deselectAllBtn').addEventListener('click', function() {
                document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                });
                applyFiltersAndRender();
            });

            // Series search
            document.getElementById('seriesSearch').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                const checkboxes = document.querySelectorAll('#seriesCheckboxes .checkbox-item');
                
                checkboxes.forEach(item => {
                    const label = item.querySelector('label');
                    if (label) {
                        const text = label.textContent.toLowerCase();
                        if (text.includes(searchTerm)) {
                            item.style.display = 'flex';
                        } else {
                            item.style.display = 'none';
                        }
                    }
                });
            });

            // Bar chart mode changes
            document.querySelectorAll('input[name="barChartMode"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        renderBarChart();
                    }
                });
            });

            // Pie chart mode changes
            document.querySelectorAll('input[name="pieChartMode"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        renderPieChart();
                    }
                });
            });

            // Download buttons
            document.getElementById('downloadFullData').addEventListener('click', () => downloadData('full'));
            document.getElementById('downloadFilteredData').addEventListener('click', () => downloadData('filtered'));
            
            // Chart download buttons
            document.getElementById('downloadLineChart').addEventListener('click', () => downloadChart('lineChart', 'elektrik_cizgi_grafik.png'));
            document.getElementById('downloadBarChart').addEventListener('click', () => downloadChart('barChart', 'elektrik_sutun_grafik.png'));
            document.getElementById('downloadPieChart').addEventListener('click', () => downloadChart('pieChart', 'elektrik_pasta_grafik.png'));
        }

        function handleYearInputChange() {
            const start = parseInt(document.getElementById('yearInputStart').value);
            const end = parseInt(document.getElementById('yearInputEnd').value);
            
            if (!isNaN(start) && !isNaN(end) && start <= end) {
                yearSlider.noUiSlider.set([start, end]);
                startYear = start;
                endYear = end;
                applyFiltersAndRender();
            }
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}Content`).classList.add('active');

            // Render chart if needed
            if (tabName === 'line') {
                renderLineChart();
            } else if (tabName === 'bar') {
                renderBarChart();
            } else if (tabName === 'pie') {
                renderPieChart();
            }
        }

        function populateSeriesFilter() {
            const container = document.getElementById('seriesCheckboxes');
            container.innerHTML = '';
            
            const data = typeof embeddedDataB !== 'undefined' ? embeddedDataB : [];
            const dataType = document.querySelector('input[name="dataType"]:checked').value;
            
            // Filter data based on selected type
            let filteredData = data;
            if (dataType === 'production') {
                filteredData = data.filter(item => item.Kategori.includes('Elektrik Üretimi'));
            } else if (dataType === 'capacity') {
                filteredData = data.filter(item => item.Kategori.includes('Kurulu Güç'));
            }
            
            filteredData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `series-${index}`;
                checkbox.value = item.Kategori;
                checkbox.addEventListener('change', applyFiltersAndRender);
                
                // Check first few items by default
                if (index < 3) {
                    checkbox.checked = true;
                }
                
                const label = document.createElement('label');
                label.htmlFor = `series-${index}`;
                // Clean up the category name for display
                let displayName = item.Kategori;
                displayName = displayName.replace('Elektrik Üretimi - ', '');
                displayName = displayName.replace('Kurulu Güç - ', '');
                label.textContent = displayName;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
            });
        }

        function setupTopScrollbar() {
            const topScrollbar = document.querySelector('.top-scrollbar');
            const topScrollbarThumb = document.querySelector('.top-scrollbar-thumb');
            const tableContainer = document.getElementById('mainTableContainer');
            const dataTable = document.querySelector('.data-table');
            
            if (!topScrollbar || !tableContainer || !dataTable) return;
            
            // Set the thumb width to match the table content width
            const tableWidth = dataTable.offsetWidth;
            topScrollbarThumb.style.width = tableWidth + 'px';
            
            // Synchronize scrolling: top scrollbar -> table
            topScrollbar.addEventListener('scroll', function() {
                tableContainer.scrollLeft = topScrollbar.scrollLeft;
            });
            
            // Synchronize scrolling: table -> top scrollbar
            tableContainer.addEventListener('scroll', function() {
                topScrollbar.scrollLeft = tableContainer.scrollLeft;
            });
        }

        function applyFiltersAndRender() {
            const selectedSeries = Array.from(document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            if (selectedSeries.length === 0) {
                currentFilteredData = [];
                renderTable();
                clearCharts();
                return;
            }

            const data = typeof embeddedDataB !== 'undefined' ? embeddedDataB : [];
            const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
            
            currentFilteredData = selectedSeries.map(seriesName => {
                const seriesData = data.find(item => item.Kategori === seriesName);
                if (!seriesData) return null;
                
                const result = { Kategori: seriesData.Kategori };
                yearsInRange.forEach(year => {
                    result[year] = seriesData[year];
                });
                return result;
            }).filter(item => item !== null);

            renderTable();
            renderLineChart();
            renderBarChart();
            renderPieChart();
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');

        function downloadData(type) {
            let data, filename;
            
            if (type === 'full') {
                const allData = typeof embeddedDataB !== 'undefined' ? embeddedDataB : [];
                data = convertToCSV(allData, allYears);
                filename = 'elektrik_tam_veri.csv';
            } else {
                if (currentFilteredData.length === 0) {
                    alert('İndirilecek filtrelenmiş veri yok.');
                    return;
                }
                const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
                data = convertToCSV(currentFilteredData, yearsInRange);
                filename = `elektrik_filtreli_${startYear}_${endYear}.csv`;
            }
            
            triggerDownload(data, filename);
        }

        function convertToCSV(data, years) {
            const headers = ['Kategori', ...years.map(String)];
            const rows = [headers];
            
            data.forEach(item => {
                const row = [item.Kategori];
                years.forEach(year => {
                    let value = item[year];
                    if (value === null || value === undefined) {
                        value = '';
                    }
                    row.push(value);
                });
                rows.push(row);
            });
            
            return rows.map(row => 
                row.map(cell => {
                    const str = String(cell);
                    return str.includes(',') ? `"${str}"` : str;
                }).join(',')
            ).join('\r\n');
        }

        function triggerDownload(csvData, filename) {
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadChart(chartId, filename) {
            const canvas = document.getElementById(chartId);
            if (!canvas) {
                alert('Grafik bulunamadı.');
                return;
            }

            // Create enhanced canvas with professional layout
            createProfessionalChartImage(canvas, filename, chartId);
        }

        function createProfessionalChartImage(chartCanvas, filename, chartType) {
            // Create a larger canvas for the professional layout with higher DPI
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');
            
            // Set high DPI canvas dimensions for better quality
            const pixelRatio = window.devicePixelRatio || 3;
            const width = 1800;
            let height = 1200; // Base height
            
            // Check if we have external legends and adjust height accordingly
            const hasLineLegend = document.getElementById('lineLegendContainer').style.display !== 'none';
            const hasPieLegend = document.getElementById('pieLegendContainer') ? 
                document.getElementById('pieLegendContainer').style.display !== 'none' : false;
            
            // Store legend data before processing
            let legendData = null;
            let legendHeight = 0;
            
            if (hasLineLegend && lineChart && lineChart.data) {
                legendData = {
                    type: 'line',
                    items: lineChart.data.datasets.map((dataset, index) => ({
                        label: dataset.label,
                        color: dataset.borderColor,
                        visible: lineChart.isDatasetVisible(index)
                    }))
                };
                
                // Calculate required legend height
                const itemsPerRow = Math.floor((width - 160) / 280);
                const visibleItems = legendData.items.filter(item => item.visible);
                const totalRows = Math.ceil(visibleItems.length / itemsPerRow);
                legendHeight = 60 + (totalRows * 30) + 20; // Title + rows + padding
                
            } else if (hasPieLegend && pieChart && pieChart.data) {
                legendData = {
                    type: 'pie',
                    items: pieChart.data.datasets[0].data.map((value, index) => ({
                        label: pieChart.data.labels[index],
                        color: pieChart.data.datasets[0].backgroundColor[index],
                        value: value,
                        visible: !pieChart.getDatasetMeta(0).data[index].hidden
                    }))
                };
                
                // Calculate required legend height
                const itemsPerRow = Math.floor((width - 160) / 280);
                const visibleItems = legendData.items.filter(item => item.visible);
                const totalRows = Math.ceil(visibleItems.length / itemsPerRow);
                legendHeight = 60 + (totalRows * 30) + 20; // Title + rows + padding
            }
            
            if (hasLineLegend || hasPieLegend) {
                height += legendHeight + 40; // Add legend height plus some extra padding
            }
            
            // Set actual canvas size (high DPI)
            exportCanvas.width = width * pixelRatio;
            exportCanvas.height = height * pixelRatio;
            
            // Set display size
            exportCanvas.style.width = width + 'px';
            exportCanvas.style.height = height + 'px';
            
            // Scale context for high DPI
            ctx.scale(pixelRatio, pixelRatio);
            
            // Enable high-quality rendering settings
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.textRenderingOptimization = 'optimizeQuality';
            if (ctx.textRendering) ctx.textRendering = 'geometricPrecision';
            
            // Fill with white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // Load and draw logo
            const logo = new Image();
            logo.crossOrigin = 'anonymous';
            logo.onload = function() {
                // High-quality logo rendering with preserved aspect ratio
                const maxLogoSize = 200;
                const logoAspectRatio = 1.500;
                const logoMargin = 40;
                
                let logoWidth, logoHeight;
                if (logoAspectRatio > 1) {
                    logoWidth = maxLogoSize;
                    logoHeight = maxLogoSize / logoAspectRatio;
                } else {
                    logoHeight = maxLogoSize;
                    logoWidth = maxLogoSize * logoAspectRatio;
                }
                
                // Enable high-quality rendering for logo
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                // Calculate position (top-right with better spacing)
                const logoX = width - logoWidth - logoMargin;
                const logoY = logoMargin;
                
                // Draw logo with high quality
                ctx.drawImage(logo, logoX, logoY, logoWidth, logoHeight);
                
                // Optional: Add subtle drop shadow for better visibility
                ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                // Reset shadow for subsequent drawing
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                // Continue with rest of the drawing
                drawChartContent();
            };
            
            logo.onerror = function() {
                console.warn('Logo could not be loaded, continuing without it');
                drawChartContent();

            function drawChartContent() {
                // Set up high-quality typography
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                // Main title with improved typography
                ctx.fillStyle = '#1a1a1a';
                ctx.font = 'bold 42px "Segoe UI", Arial, sans-serif';
                const mainTitle = getChartTitle(chartType);
                ctx.fillText(mainTitle, 60, 50);
                
                // Subtitle with data info
                ctx.fillStyle = '#4a4a4a';
                ctx.font = '24px "Segoe UI", Arial, sans-serif';
                const subtitle = getChartSubtitle(chartType);
                ctx.fillText(subtitle, 60, 105);
                
                // Data source and period with improved styling
                ctx.fillStyle = '#666666';
                ctx.font = '18px "Segoe UI", Arial, sans-serif';
                const dataInfo = `Dönem: ${startYear}-${endYear} | Veri Kaynağı: Türkiye'nin Enerji Geleceği (1923-2123)`;
                ctx.fillText(dataInfo, 60, 145);
                
                // Calculate chart area
                const chartAreaTop = 200;
                let chartAreaHeight = height - chartAreaTop - 150;
                const chartAreaWidth = width - 120;
                
                // Adjust chart height if we have external legends
                let legendAreaTop = chartAreaTop + chartAreaHeight + 20;
                if (hasLineLegend || hasPieLegend) {
                    chartAreaHeight -= (legendHeight + 40); // Reduce chart height to make room for legend
                    legendAreaTop = chartAreaTop + chartAreaHeight + 20;
                }
                
                // Create a temporary high-resolution canvas to scale the original chart
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                // Set high resolution for chart scaling
                const chartPixelRatio = 3;
                tempCanvas.width = chartAreaWidth * chartPixelRatio;
                tempCanvas.height = chartAreaHeight * chartPixelRatio;
                
                // Scale context
                tempCtx.scale(chartPixelRatio, chartPixelRatio);
                
                // Enable high-quality rendering for chart
                tempCtx.imageSmoothingEnabled = true;
                tempCtx.imageSmoothingQuality = 'high';
                
                // Fill temp canvas with white background
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillRect(0, 0, chartAreaWidth, chartAreaHeight);
                
                // Draw the original chart scaled to fit with high quality
                tempCtx.drawImage(chartCanvas, 0, 0, chartAreaWidth, chartAreaHeight);
                
                // Draw the scaled chart onto main canvas with high quality
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(tempCanvas, 60, chartAreaTop, chartAreaWidth, chartAreaHeight);
                
                // Draw external legend if present
                if (legendData) {
                    drawExternalLegendFromData(ctx, legendData, legendAreaTop, width);
                }
                
                // Add footer with website info
                ctx.fillStyle = '#888888';
                ctx.font = '16px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('Türkiye Enerji Veri Platformu', width - 60, height - 50);
                
                // Add border around chart area with better styling
                ctx.strokeStyle = '#d0d0d0';
                ctx.lineWidth = 2;
                ctx.strokeRect(60, chartAreaTop, chartAreaWidth, chartAreaHeight);
                
                // Download the final image with high quality
                exportCanvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                }, 'image/png', 1.0);
            }
        }

        function drawExternalLegendFromData(ctx, legendData, startY, canvasWidth) {
            if (!legendData || !legendData.items || legendData.items.length === 0) return;
            
            // Calculate required dimensions
            const itemWidth = 280;
            const itemHeight = 25;
            const itemsPerRow = Math.floor((canvasWidth - 160) / itemWidth);
            const visibleItems = legendData.items.filter(item => item.visible);
            const totalRows = Math.ceil(visibleItems.length / itemsPerRow);
            const legendHeight = 60 + (totalRows * (itemHeight + 5)) + 20; // Title + rows + padding
            
            // Set up legend styling with dynamic height
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(60, startY, canvasWidth - 120, legendHeight);
            
            // Draw legend border
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.strokeRect(60, startY, canvasWidth - 120, legendHeight);
            
            // Draw legend title
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'left';
            const legendTitle = legendData.type === 'line' ? 'Veri Serileri:' : 'Kategori Dağılımı:';
            ctx.fillText(legendTitle, 80, startY + 20);
            
            // Draw legend items
            let currentX = 80;
            let currentY = startY + 50;
            let visibleIndex = 0;
            
            legendData.items.forEach((item, index) => {
                if (!item.visible) return; // Skip hidden items
                
                if (visibleIndex > 0 && visibleIndex % itemsPerRow === 0) {
                    currentY += itemHeight + 5;
                    currentX = 80;
                }
                
                // Convert color to canvas format
                let canvasColor = item.color;
                if (typeof canvasColor === 'string' && canvasColor.startsWith('#')) {
                    // Already a hex color
                } else if (typeof canvasColor === 'string' && canvasColor.startsWith('rgb')) {
                    // Already an RGB color
                } else {
                    canvasColor = '#333333'; // Fallback
                }
                
                // Draw color indicator
                if (legendData.type === 'line') {
                    // Draw line for line charts
                    ctx.strokeStyle = canvasColor;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(currentX, currentY + 8);
                    ctx.lineTo(currentX + 30, currentY + 8);
                    ctx.stroke();
                } else {
                    // Draw rectangle for pie charts
                    ctx.fillStyle = canvasColor;
                    ctx.fillRect(currentX, currentY + 2, 12, 12);
                }
                
                // Draw text
                ctx.fillStyle = '#333333';
                ctx.font = '13px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'left';
                const displayText = item.label && item.label.length > 25 ? 
                    item.label.substring(0, 22) + '...' : (item.label || '');
                ctx.fillText(displayText, currentX + 40, currentY + 12);
                
                currentX += itemWidth;
                visibleIndex++;
            });
        }

        function getChartTitle(chartType) {
            const dataType = document.querySelector('input[name="dataType"]:checked').value;
            const baseTitle = `Türkiye Elektrik ${dataType === 'capacity' ? 'Kurulu Güç' : 'Üretim'}`;
            switch(chartType) {
                case 'lineChart':
                    return `${baseTitle} - Zaman Serisi Analizi`;
                case 'barChart':
                    const barMode = document.querySelector('input[name="barChartMode"]:checked').value;
                    return `${baseTitle} - ${barMode === 'sum' ? 'Toplam' : 'Ortalama'} Değerler`;
                case 'pieChart':
                    const pieMode = document.querySelector('input[name="pieChartMode"]:checked').value;
                    return `${baseTitle} - Kaynak Dağılımı (${pieMode === 'sum' ? 'Toplam' : 'Ortalama'})`;
                default:
                    return baseTitle;
            }
        }

        function getChartSubtitle(chartType) {
            const selectedCount = document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]:checked').length;
            const dataType = document.querySelector('input[name="dataType"]:checked').value;
            const unit = dataType === 'capacity' ? 'MW' : 'GWh';
            
            switch(chartType) {
                case 'lineChart':
                    return `${selectedCount} kaynak için yıllık değişim trendi (${unit})`;
                case 'barChart':
                    return `${selectedCount} kaynak için karşılaştırmalı analiz (${unit})`;
                case 'pieChart':
                    return `${selectedCount} kaynak için oransal dağılım analizi (${unit})`;
                default:
                    return `Elektrik ${dataType === 'capacity' ? 'kurulu güç' : 'üretim'} verileri (${unit})`;
            }
        }
    </script>
</body>
</html>
