<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkınma Planları</title>
    <style>
        * { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important; 
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            padding: 20px;
            background: white;
            color: #333; 
            line-height: 1.6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        .main-container {
            max-width: 1600px;
            width: 95%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        .header {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
            color: white !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        .header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
            color: white !important;
        }
        
        .controls {
            padding: 1.5rem;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        
        .search-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        .search-box, .institution-filter {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .search-box:focus, .institution-filter:focus {
            outline: none;
            border-color: #228B22;
        }
        
        .stats {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
            flex-wrap: wrap;
        }
        
        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
        }
        
        .documents-container {
            padding: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
        }
        
        .document-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 1rem;
            padding: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .document-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .document-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .document-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .meta-item {
            display: flex;
            gap: 0.5rem;
        }
        
        .meta-label {
            font-weight: 600;
            color: #666;
            min-width: 120px;
        }
        
        .meta-value {
            color: #333;
        }
        
        .energy-content {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #228B22;
            margin-bottom: 1rem;
        }
        
        .energy-content h4 {
            margin: 0 0 0.5rem 0;
            color: #006400;
            font-size: 1rem;
        }
        
        .energy-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .energy-item {
            background: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
        }
        
        .access-link {
            display: inline-block;
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .access-link:hover {
            transform: translateY(-1px);
            text-decoration: none;
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .search-container {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .document-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Kalkınma Planları</h1>
        </div>
        
        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchBox" class="search-box" placeholder="Plan adı veya içerik bazında arama yapın...">
                <select id="institutionFilter" class="institution-filter">
                    <option value="">Tüm Kurumlar</option>
                </select>
                <select id="categoryFilter" class="institution-filter">
                    <option value="">Tüm Plan Türleri</option>
                </select>
                <button class="export-btn" onclick="exportData()">📄 Excel'e Aktar</button>
            </div>
            <div class="stats">
                <span id="totalCount">Yükleniyor...</span>
                <span id="filteredCount"></span>
                <span id="institutionCount"></span>
            </div>
        </div>
        
        <div class="documents-container">
            <div class="loading" id="loading">Belgeler yükleniyor...</div>
            <div id="documentsGrid" style="display: none;"></div>
            <div class="no-results" id="noResults" style="display: none;">
                Arama kriterlerinize uygun belge bulunamadı.
            </div>
        </div>
    </div>

    <script>
        let allDocuments = [];
        let filteredDocuments = [];
        
        function renderDocuments(documents) {
            const grid = document.getElementById('documentsGrid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('noResults');
            
            loading.style.display = 'none';
            
            if (!documents || documents.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.style.display = 'block';
            
            const html = documents.map(doc => `
                <div class="document-card">
                    <div class="document-title">${doc.baslik || 'Başlık belirtilmemiş'}</div>
                    <div class="document-meta">
                        <div class="meta-item">
                            <span class="meta-label">Yayınlayan Kurum:</span>
                            <span class="meta-value">${doc.yayinlayanKurum || 'Belirtilmemiş'}</span>
                        </div>
                    </div>
                    ${doc.enerjiIcerigi && doc.enerjiIcerigi.length > 0 ? `
                        <div class="energy-content">
                            <h4>Enerji İçeriği:</h4>
                            <div class="energy-items">
                                ${doc.enerjiIcerigi.map(item => `<span class="energy-item">${item}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                    ${doc.link ? `
                        <a href="${doc.link}" target="_blank" class="access-link">
                            🔗 Plana Erişim
                        </a>
                    ` : ''}
                </div>
            `).join('');
            
            grid.innerHTML = html;
        }
        
        function categorizeDocument(doc) {
            const title = (doc.baslik || '').toLowerCase();
            const energyContent = (doc.enerjiIcerigi || []).join(' ').toLowerCase();
            const content = title + ' ' + energyContent;
            
            if (title.includes('birinci') || title.includes('i.') || title.includes('1.')) {
                return 'Birinci Dönem Planları';
            }
            if (title.includes('ikinci') || title.includes('ii.') || title.includes('2.')) {
                return 'İkinci Dönem Planları';  
            }
            if (title.includes('üçüncü') || title.includes('iii.') || title.includes('3.')) {
                return 'Üçüncü Dönem Planları';
            }
            if (title.includes('dördüncü') || title.includes('iv.') || title.includes('4.')) {
                return 'Dördüncü Dönem Planları';
            }
            if (title.includes('beşinci') || title.includes('v.') || title.includes('5.')) {
                return 'Beşinci Dönem Planları';
            }
            if (title.includes('altıncı') || title.includes('vi.') || title.includes('6.')) {
                return 'Altıncı Dönem Planları';
            }
            if (title.includes('yedinci') || title.includes('vii.') || title.includes('7.')) {
                return 'Yedinci Dönem Planları';
            }
            if (title.includes('sekizinci') || title.includes('viii.') || title.includes('8.')) {
                return 'Sekizinci Dönem Planları';
            }
            if (title.includes('dokuzuncu') || title.includes('ix.') || title.includes('9.')) {
                return 'Dokuzuncu Dönem Planları';
            }
            if (title.includes('onuncu') || title.includes('x.') || title.includes('10.')) {
                return 'Onuncu Dönem Planları';
            }
            if (title.includes('on birinci') || title.includes('xi.') || title.includes('11.')) {
                return 'On Birinci Dönem Planları';
            }
            return 'Genel Kalkınma Planları';
        }
        
        function populateInstitutionFilter() {
            const institutions = [...new Set(allDocuments.map(doc => doc.yayinlayanKurum).filter(Boolean))].sort();
            const select = document.getElementById('institutionFilter');
            
            institutions.forEach(institution => {
                const option = document.createElement('option');
                option.value = institution;
                option.textContent = institution;
                select.appendChild(option);
            });
        }
        
        function populateCategoryFilter() {
            const categories = [...new Set(allDocuments.map(doc => categorizeDocument(doc)))];
            
            // Define proper numerical order for development plans
            const planOrder = [
                'Birinci Dönem Planları',
                'İkinci Dönem Planları', 
                'Üçüncü Dönem Planları',
                'Dördüncü Dönem Planları',
                'Beşinci Dönem Planları',
                'Altıncı Dönem Planları',
                'Yedinci Dönem Planları',
                'Sekizinci Dönem Planları',
                'Dokuzuncu Dönem Planları',
                'Onuncu Dönem Planları',
                'On Birinci Dönem Planları',
                'Genel Kalkınma Planları'
            ];
            
            // Sort categories according to plan order
            const sortedCategories = categories.sort((a, b) => {
                const indexA = planOrder.indexOf(a);
                const indexB = planOrder.indexOf(b);
                
                // If both are in planOrder, use their index order
                if (indexA !== -1 && indexB !== -1) {
                    return indexA - indexB;
                }
                // If only one is in planOrder, prioritize it
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                // If neither is in planOrder, use alphabetical
                return a.localeCompare(b, 'tr');
            });
            
            const select = document.getElementById('categoryFilter');
            
            sortedCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        }
        
        function filterDocuments() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const institutionFilter = document.getElementById('institutionFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            let filtered = allDocuments;
            
            if (searchTerm) {
                filtered = filtered.filter(doc => 
                    (doc.baslik && doc.baslik.toLowerCase().includes(searchTerm)) ||
                    (doc.yayinlayanKurum && doc.yayinlayanKurum.toLowerCase().includes(searchTerm)) ||
                    (doc.enerjiIcerigi && doc.enerjiIcerigi.some(item => item.toLowerCase().includes(searchTerm)))
                );
            }
            
            if (institutionFilter) {
                filtered = filtered.filter(doc => doc.yayinlayanKurum === institutionFilter);
            }
            
            if (categoryFilter) {
                filtered = filtered.filter(doc => categorizeDocument(doc) === categoryFilter);
            }
            
            filteredDocuments = filtered;
            renderDocuments(filteredDocuments);
            updateStats();
        }
        
        function updateStats() {
            const totalCount = document.getElementById('totalCount');
            const filteredCount = document.getElementById('filteredCount');
            const institutionCount = document.getElementById('institutionCount');
            
            totalCount.textContent = `Toplam ${allDocuments.length} kalkınma planı`;
            
            if (filteredDocuments.length !== allDocuments.length) {
                filteredCount.textContent = `Görüntülenen: ${filteredDocuments.length}`;
            } else {
                filteredCount.textContent = '';
            }
            
            const institutions = [...new Set(allDocuments.map(doc => doc.yayinlayanKurum).filter(Boolean))];
            institutionCount.textContent = `${institutions.length} farklı kurum`;
        }
        
        function exportData() {
            const csvContent = [
                ['ID', 'Yayınlayan Kurum', 'Başlık', 'Enerji İçeriği', 'Link'].join(','),
                ...filteredDocuments.map(doc => [
                    doc.id || '',
                    `"${(doc.yayinlayanKurum || '').replace(/"/g, '""')}"`,
                    `"${(doc.baslik || '').replace(/"/g, '""')}"`,
                    `"${(doc.enerjiIcerigi ? doc.enerjiIcerigi.join('; ') : '').replace(/"/g, '""')}"`,
                    doc.link || ''
                ].join(','))
            ].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'kalkinma_planlari.csv';
            link.click();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof embeddedKalkinmaData !== 'undefined') {
                allDocuments = embeddedKalkinmaData;
                filteredDocuments = [...allDocuments];
                populateInstitutionFilter();
                populateCategoryFilter();
                renderDocuments(filteredDocuments);
                updateStats();
                
                document.getElementById('searchBox').addEventListener('input', filterDocuments);
                document.getElementById('institutionFilter').addEventListener('change', filterDocuments);
                document.getElementById('categoryFilter').addEventListener('change', filterDocuments);
            } else {
                document.getElementById('loading').textContent = 'Veri yüklenirken hata oluştu.';
            }
        });
    </script>
