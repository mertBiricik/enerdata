            opacity: 0.9;

        }
        
        .controls {
            padding: 1.5rem;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        
        .search-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        .search-box, .date-filter {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .search-box:focus, .date-filter:focus {
            outline: none;
            border-color: #228B22;
        }
        
        .stats {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
            flex-wrap: wrap;
        }
        
        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
        }
        
        .documents-container {
            padding: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
        }
        
        .document-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 1rem;
            padding: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .document-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .document-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .document-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .meta-item {
            display: flex;
            gap: 0.5rem;
        }
        
        .meta-label {
            font-weight: 600;
            color: #666;
            min-width: 80px;
        }
        
        .meta-value {
            color: #333;
        }
        
        .access-link {
            display: inline-block;
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 0.5rem;
            transition: transform 0.2s;
        }
        
        .access-link:hover {
            transform: translateY(-1px);
            text-decoration: none;
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .search-container {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .document-meta {
                grid-template-columns: 1fr;
            }
        }

    <script>
        let allDocuments = [];
        let filteredDocuments = [];
        
        function formatDate(dateStr) {
            if (!dateStr) return 'Belirtilmemiş';
            return dateStr.toString();
        }
        
        function extractYear(dateStr) {
            if (!dateStr) return null;
            const match = dateStr.toString().match(/(\d{4})/);
            return match ? parseInt(match[1]) : null;
        }
        
        function renderDocuments(documents) {
            const grid = document.getElementById('documentsGrid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('noResults');
            
            loading.style.display = 'none';
            
            if (!documents || documents.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.style.display = 'block';
            
            const html = documents.map(doc => `
                <div class="document-card">
                    <div class="document-title">${doc.baslik || 'Başlık belirtilmemiş'}</div>
                    <div class="document-meta">
                        <div class="meta-item">
                            <span class="meta-label">Yazar:</span>
                            <span class="meta-value">${doc.yazar || 'Belirtilmemiş'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Basım Tarihi:</span>
                            <span class="meta-value">${formatDate(doc.basimTarihi)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Yayınevi:</span>
                            <span class="meta-value">${doc.yayinevi || 'Belirtilmemiş'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Basım Yeri:</span>
                            <span class="meta-value">${doc.basimYeri || 'Belirtilmemiş'}</span>
                        </div>
                    </div>
                    ${doc.erisimLinki ? `
                        <a href="${doc.erisimLinki}" target="_blank" class="access-link">
                            🔗 Belgeye Erişim
                        </a>
                    ` : ''}
                </div>
            `).join('');
            
            grid.innerHTML = html;
        }
        
        function categorizeDocument(doc) {
            const title = (doc.baslik || '').toLowerCase();
            const author = (doc.yazar || '').toLowerCase();
            const publisher = (doc.yayinevi || '').toLowerCase();
            const content = title + ' ' + author + ' ' + publisher;
            
            if (content.includes('kongre') || content.includes('konferans') || content.includes('sempozyum')) {
                return 'Kongre ve Konferanslar';
            }
            if (content.includes('plan') || content.includes('program') || content.includes('strateji')) {
                return 'Plan ve Stratejiler';
            }
            if (content.includes('rapor') || content.includes('araştırma') || content.includes('inceleme')) {
                return 'Raporlar ve Araştırmalar';
            }
            if (content.includes('devlet') || content.includes('bakanlık') || content.includes('resmi')) {
                return 'Resmi Yayınlar';
            }
            if (content.includes('yıl') && (content.includes('1923') || content.includes('cumhuriyet'))) {
                return 'Cumhuriyet Dönemi';
            }
            if (content.includes('ekonomi') || content.includes('kalkınma') || content.includes('sanayi')) {
                return 'Ekonomik Politikalar';
            }
            return 'Diğer Stratejik Belgeler';
        }
        
        function populateCategoryFilter() {
            const categories = [...new Set(allDocuments.map(doc => categorizeDocument(doc)))].sort();
            const select = document.getElementById('categoryFilter');
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        }
        
        function filterDocuments() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const yearFilter = document.getElementById('yearFilter').value.trim();
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            let filtered = allDocuments;
            
            if (searchTerm) {
                filtered = filtered.filter(doc => 
                    (doc.baslik && doc.baslik.toLowerCase().includes(searchTerm)) ||
                    (doc.yazar && doc.yazar.toLowerCase().includes(searchTerm)) ||
                    (doc.yayinevi && doc.yayinevi.toLowerCase().includes(searchTerm))
                );
            }
            
            if (yearFilter) {
                if (yearFilter.includes('-')) {
                    const [startYear, endYear] = yearFilter.split('-').map(y => parseInt(y.trim()));
                    filtered = filtered.filter(doc => {
                        const year = extractYear(doc.basimTarihi);
                        return year && year >= startYear && year <= endYear;
                    });
                } else {
                    const targetYear = parseInt(yearFilter);
                    filtered = filtered.filter(doc => {
                        const year = extractYear(doc.basimTarihi);
                        return year === targetYear;
                    });
                }
            }
            
            if (categoryFilter) {
                filtered = filtered.filter(doc => categorizeDocument(doc) === categoryFilter);
            }
            
            filteredDocuments = filtered;
            renderDocuments(filteredDocuments);
            updateStats();
        }
        
        function updateStats() {
            const totalCount = document.getElementById('totalCount');
            const filteredCount = document.getElementById('filteredCount');
            const dateRange = document.getElementById('dateRange');
            
            totalCount.textContent = `Toplam ${allDocuments.length} strateji belgesi`;
            
            if (filteredDocuments.length !== allDocuments.length) {
                filteredCount.textContent = `Görüntülenen: ${filteredDocuments.length}`;
            } else {
                filteredCount.textContent = '';
            }
            
            const years = allDocuments.map(doc => extractYear(doc.basimTarihi)).filter(y => y);
            if (years.length > 0) {
                const minYear = Math.min(...years);
                const maxYear = Math.max(...years);
                dateRange.textContent = `${minYear} - ${maxYear}`;
            }
        }
        
        function exportData() {
            const csvContent = [
                ['ID', 'Yazar', 'Başlık', 'Basım Tarihi', 'Yayınevi', 'Basım Yeri', 'Erişim Linki'].join(','),
                ...filteredDocuments.map(doc => [
                    doc.id || '',
                    `"${(doc.yazar || '').replace(/"/g, '""')}"`,
                    `"${(doc.baslik || '').replace(/"/g, '""')}"`,
                    doc.basimTarihi || '',
                    `"${(doc.yayinevi || '').replace(/"/g, '""')}"`,
                    `"${(doc.basimYeri || '').replace(/"/g, '""')}"`,
                    doc.erisimLinki || ''
                ].join(','))
            ].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'strateji_politika_belgeleri.csv';
            link.click();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof embeddedStratejiData !== 'undefined') {
                allDocuments = embeddedStratejiData;
                filteredDocuments = [...allDocuments];
                populateCategoryFilter();
                renderDocuments(filteredDocuments);
                updateStats();
                
                document.getElementById('searchBox').addEventListener('input', filterDocuments);
                document.getElementById('yearFilter').addEventListener('input', filterDocuments);
                document.getElementById('categoryFilter').addEventListener('change', filterDocuments);
            } else {
                document.getElementById('loading').textContent = 'Veri yüklenirken hata oluştu.';
            }
        });
    </script>
