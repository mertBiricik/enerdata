    <style>
        * {

        body {

            color: #333;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        .header {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
            color: white !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

            font-size: 1.1rem;

            color: white !important;
        }
        
        .controls {

        }
        
        .search-container {

        }

            min-width: 200px;
            padding: 0.75rem;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;

            border-color: #228B22;
        }

            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
            flex-wrap: wrap;
        }

            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
        }
        
        .documents-container {
            padding: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
        }
        
        .document-card {
            background: white;
            border: 1px solid #e9ecef;

            margin-bottom: 1rem;
            padding: 1.5rem;

            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .document-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .document-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .meta-item {
            display: flex;
            gap: 0.5rem;
        }
        
        .meta-label {
            font-weight: 600;
            color: #666;
            min-width: 80px;
        }
        
        .meta-value {
            color: #333;
        }
        
        .document-purpose {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #228B22;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
        }
        
        .access-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .access-link:hover {
            transform: translateY(-1px);
            text-decoration: none;
            color: white;
        }

            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }

            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }

            .search-container {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .document-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        "Col_5": "Enerji Durumu ve Sorunlar: Türkiye'nin enerji ihtiyacı hızla artarken kaynakların yeterli düzeyde değerlendirilmemesi arz güvenliği sorunlarına neden olmuştur. Enerji üretim altyapısı bölgesel olarak dengesiz dağılmıştır; bazı bölgelerde arz fazlası bazı yerlerde arz yetersizliği gözlenmiştir. Elektirik enerjisinde iletim ve dağıtım sistemlerinde kayıp-kaçak oranı yüksektir; bu durum sistem verimliliğini düşürmektedir. Talep ve Üretim Hedefleri: Plan döneminde birincil enerji üretiminin yıllık ortalama %5,4 oranında artırılması, tüketimin ise %5,7 oranınında yükselmesi hedeflenmiştir. 1994 yılı için enerji tüketimi 58 milyon TEP, üretimi ise 43 milyon TEP olarak öngörülmüştür. -Elelktrik enerjisinde 1994 yılına kadar toplam kurulu gücün 19.000 MW çıkarılması üretimin de 85 milyar kWh seviyesine ulaşması planlanmıştır. Enerji üretiminde kömür, hidroelektrik ve yerli kaynakların payı artırılarak dışa bağımlılığın azaltılması hedeflenmiştir. Politika ve Tedbirler: Enerji yatırımlarında kamu öncülüğünde özel sektör katılımı artırılacaktır; tevşikler uygulanacaktır. Yenilenebilir enerji kaynaklarının (özellikle hidroelektrik) değerlendirilmesine öncelik verilecektir. Enerji verimliliği artırılacak sanayide ve ulaştırmada enerji tasarrufu teşvik edilecektir. Doğal gaz kullanımının yaygınlaştırılması için iletim ve dağıtım altyapısı geliştirilecektir. Strateji ve Yapısal Reformlar: Enerji sektöründe yatırım kararları uzun dönemli arz-talep projeksiyonlarına göre planlanacaktır. Enerji fiyatlamasında maliyet esas alınacak ve sübvansiyonlar kademeli olarak azaltılacaktır. Elektrik üretim ve dağıtımında özelleştirme çalışmaları başlatılacaktır; kamu kuruluşlarının etkinliği artırılacaktır.",
        "Çevre ve Sürdürülebilirlik": "Çevre ve Yerleşme ana başlığı altında Çevre Sorunları (s.312- 313).",

        "Col_5": "Enerji Durumu ve Sorunlar: Enerji talebi ekonomik büyümeye paralel olarak hızla artmakta, arz bu talebi karşılamakta yetersiz kalabilmektedir. Enerji tüketiminde fosil yakıtların ağırlığı sürerken, dışa bağımlılık özellikle doğalgaz ve petrolde oldukça yüksektir. Elektrik arz güvenliği risk altında olup, yatırım eksiklikleri kritik bir sorundur. -Kayıp-kaçak oranları yüksekliğini korumakta, verimlilik düşük seviyededir . Talep ve Üretim Hedefleri: Birincil enerji arzının 2013 yılına kadar %6,2 oranında yıllık ortalamayla artması öngörülmüştür. Elektrik üretiminin yılda ortalama %7,4 artarak 2013’te yaklaşık 300 milyar kWh seviyesine ulaşması beklenmiştir. Kurulu güçte önemli artış öngörülmüş; 2013’e kadar 66.000 MW düzeyine ulaşılması hedeflenmiştir. Yerli ve yenilenebilir enerji kaynaklarının üretimdeki payının artırılması esas alınmıştır . Politika ve Tedbirler: Enerji sektöründe özel sektörün yatırımlarını kolaylaştırıcı düzenlemeler sürdürülecek, şeffaf ve rekabetçi piyasa yapısı güçlendirilecektir. Enerji verimliliği ulusal düzeyde stratejik hedef haline getirilmiş, sanayi ve binalarda enerji tasarrufu önlemleri yaygınlaştırılacaktır. Yenilenebilir enerji (güneş, rüzgar, biyokütle) desteklenecek, teşvik mekanizmaları geliştirilecektir. Nükleer enerjiye geçiş süreci başlatılacak ve bu alandaki altyapı yatırımları planlanacaktır . Strateji ve Yapısal Reformlar: Elektrik ve doğalgaz piyasalarında serbestleşme süreçleri sürdürülecek, EPDK'nın düzenleyici rolü güçlendirilecektir. Kamu enerji KİT’lerinin yeniden yapılandırılması ve kamu-özel ortaklığı modelleri geliştirilecektir. Enerji yatırımlarında uzun vadeli arz güvenliği dikkate alınarak stratejik planlamalar yapılacaktır. Uluslararası enerji koridoru olma hedefiyle, Türkiye’nin bölgesel enerji merkezi konumu desteklenecektir",

        let allDocuments = [];
        let filteredDocuments = [];
        
        function formatDate(dateStr) {
            if (!dateStr) return 'Belirtilmemiş';
            return dateStr.replace(/T.*/, '').replace(/-/g, '.');
        }
        
        function renderDocuments(documents) {
            const grid = document.getElementById('documentsGrid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('noResults');
            
            loading.style.display = 'none';
            
            if (!documents || documents.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.style.display = 'block';
            
            // Get all unique column headers from all documents
            const allHeaders = new Set();
            documents.forEach(doc => {
                Object.keys(doc).forEach(key => allHeaders.add(key));
            });
            const headers = Array.from(allHeaders).sort();
            
            const html = documents.map(doc => {
                // Find key fields for better presentation
                const titleField = headers.find(h => 
                    h.toLowerCase().includes('başlık') || 
                    h.toLowerCase().includes('title') ||
                    h.toLowerCase().includes('rapor başlık')
                );
                const title = titleField ? doc[titleField] : 'Başlık belirtilmemiş';
                
                const linkField = headers.find(h => 
                    h.toLowerCase().includes('link') || 
                    h.toLowerCase().includes('erişim')
                );
                const link = linkField ? doc[linkField] : null;
                
                // Find purpose/content fields for highlighted display
                const purposeFields = headers.filter(h => 
                    h.toLowerCase().includes('amaç') || 
                    h.toLowerCase().includes('enerji') || 
                    h.toLowerCase().includes('çevre') ||
                    h.toLowerCase().includes('sürdürülebilirlik') ||
                    h.toLowerCase().includes('purpose') ||
                    h.toLowerCase().includes('kararname amacı') ||
                    h.toLowerCase().includes('iklim değişikliğ') ||
                    h.toLowerCase().includes('col_5') ||
                    h.toLowerCase().includes('col_7')
                );
                
                // Separate metadata fields from content fields
                const metadataFields = headers.filter(h => 
                    h !== titleField && h !== linkField && 
                    !purposeFields.includes(h) && 
                    doc[h] && doc[h].toString().length < 150 // Short fields are metadata
                );
                
                const contentFields = purposeFields.filter(h => doc[h]);
                
                return `
                <div class="document-card">
                    <div class="document-title">${title}</div>
                    <div class="document-meta">
                        ${metadataFields.map(header => {
                            const value = doc[header];
                            const displayLabel = beautifyLabel(header);
                            
                            return `
                            <div class="meta-item">
                                <span class="meta-label">${displayLabel}:</span>
                                <span class="meta-value">${
                                    header.toLowerCase().includes('tarih') || header.toLowerCase().includes('date') 
                                        ? formatDate(value) 
                                        : value
                                }</span>
                            </div>
                            `;
                        }).join('')}
                    </div>
                    ${contentFields.length > 0 ? `
                        <div class="document-purpose">
                            ${contentFields.map(field => `
                                <strong>${beautifyLabel(field)}:</strong><br>
                                ${doc[field]}
                            `).join('<br><br>')}
                        </div>
                    ` : ''}
                    ${link ? `
                        <a href="${link}" target="_blank" class="access-link">
                            Belgeye Erişim
                        </a>
                    ` : ''}
                </div>
                `;
            }).join('');
            
            grid.innerHTML = html;
        }
        
        function beautifyLabel(header) {
            // Convert raw Excel headers to beautiful display labels
            const labelMap = {
                'No': 'Belge No',
                'Kanun No': 'Kanun No',
                'Kabul Tarihi': 'Kabul Tarihi',
                'RG Tarih': 'RG Tarihi',
                'RG Sayı': 'RG Sayısı',
                'Yazar': 'Yazar',
                'Basım Tarihi': 'Basım Tarihi',
                'Yayınevi/Basımevi': 'Yayınevi',
                'Basım Yeri': 'Basım Yeri',
                'Yayınlayan Kurum': 'Yayınlayan Kurum',
                'Hazırlayan': 'Hazırlayan',
                'Tarih': 'Tarih',
                'Rapor No': 'Rapor No',
                'Rapor Başlık': 'Rapor Başlığı',
                'Mevzuat No': 'Mevzuat No',
                'Mevzuat Adı': 'Mevzuat Adı',
                'Kararname No': 'Kararname No',
                'Yayın Bilgisi': 'Yayın Bilgisi',
                'Col_5': 'Detaylar ve Analiz',
                'Col_7': 'Çevresel Boyut'
            };
            
            return labelMap[header] || header;
        }
        
        function categorizeDocument(doc) {
            // Find title field dynamically
            const titleFields = Object.keys(doc).filter(key => 
                key.toLowerCase().includes('başlık') || 
                key.toLowerCase().includes('title')
            );
            const title = titleFields.length > 0 ? (doc[titleFields[0]] || '').toLowerCase() : '';
            
            // Find purpose/content fields dynamically
            const contentFields = Object.keys(doc).filter(key => 
                key.toLowerCase().includes('amaç') || 
                key.toLowerCase().includes('enerji') || 
                key.toLowerCase().includes('çevre') ||
                key.toLowerCase().includes('purpose')
            );
            const purpose = contentFields.map(field => doc[field] || '').join(' ').toLowerCase();
            
            const content = title + ' ' + purpose;
            
            if (content.includes('elektrik') || content.includes('enerji') || content.includes('güç')) {
                return 'Enerji ve Elektrik';
            }
            if (content.includes('maden') || content.includes('petrol') || content.includes('gaz')) {
                return 'Maden ve Petrol';
            }
            if (content.includes('bank') || content.includes('finans') || content.includes('kredi')) {
                return 'Finansal Kurumlar';
            }
            if (content.includes('teşkilat') || content.includes('kurul') || content.includes('müdürlük')) {
                return 'Kurumsal Yapı';
            }
            if (content.includes('belediye') || content.includes('şehir') || content.includes('kent')) {
                return 'Yerel Yönetim';
            }
            if (content.includes('vergi') || content.includes('resim') || content.includes('harç')) {
                return 'Mali Hükümler';
            }
            if (content.includes('strateji') || content.includes('plan') || content.includes('kalkınma')) {
                return 'Planlama ve Strateji';
            }
            if (content.includes('çevre') || content.includes('environment')) {
                return 'Çevre';
            }
            return 'Genel Mevzuat';
        }
        
        function populateCategoryFilter() {
            const categories = [...new Set(allDocuments.map(doc => categorizeDocument(doc)))].sort();
            const select = document.getElementById('categoryFilter');
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        }
        
        function filterDocuments() {
            const searchQuery = document.getElementById('searchBox').value.toLowerCase();
            const yearFilter = document.getElementById('yearFilter').value.trim();
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            filteredDocuments = allDocuments.filter(doc => {
                // Search filter
                if (searchQuery) {
                    const searchText = Object.values(doc).join(' ').toLowerCase();
                    if (!searchText.includes(searchQuery)) return false;
                }
                
                // Year filter
                if (yearFilter) {
                    // Find date fields dynamically
                    const dateFields = Object.keys(doc).filter(key => 
                        key.toLowerCase().includes('tarih') || 
                        key.toLowerCase().includes('date')
                    );
                    const dateValue = dateFields.length > 0 ? doc[dateFields[0]] : null;
                    const docYear = extractYear(dateValue);
                    if (docYear) {
                        if (yearFilter.includes('-')) {
                            const [startYear, endYear] = yearFilter.split('-').map(y => parseInt(y.trim()));
                            if (!isNaN(startYear) && !isNaN(endYear)) {
                                if (docYear < startYear || docYear > endYear) return false;
                            }
                        } else {
                            const filterYear = parseInt(yearFilter);
                            if (!isNaN(filterYear) && docYear !== filterYear) return false;
                        }
                    }
                }
                
                // Category filter
                if (categoryFilter) {
                    const docCategory = categorizeDocument(doc);
                    if (docCategory !== categoryFilter) return false;
                }
                
                return true;
            });
            
            renderDocuments(filteredDocuments);
            updateStats();
        }
        
        function extractYear(dateStr) {
            if (!dateStr) return null;
            const year = parseInt(dateStr.split('.')[2] || dateStr.split('-')[0] || dateStr.split('/')[2]);
            return isNaN(year) ? null : year;
        }
        
        function updateStats() {
            const totalCount = document.getElementById('totalCount');
            const filteredCount = document.getElementById('filteredCount');
            const dateRange = document.getElementById('dateRange');
            
            totalCount.textContent = `Toplam ${allDocuments.length} belge`;
            filteredCount.textContent = `${filteredDocuments.length} gösteriliyor`;
            
            const years = allDocuments.map(doc => {
                // Find date fields dynamically
                const dateFields = Object.keys(doc).filter(key => 
                    key.toLowerCase().includes('tarih') || 
                    key.toLowerCase().includes('date')
                );
                const dateValue = dateFields.length > 0 ? doc[dateFields[0]] : null;
                return extractYear(dateValue);
            }).filter(y => y);
            if (years.length > 0) {
                const minYear = Math.min(...years);
                const maxYear = Math.max(...years);
                dateRange.textContent = `${minYear} - ${maxYear}`;
            }
        }
        
        
        function exportCSV() {
            if (filteredDocuments.length === 0) {
                alert('İndirilecek veri yok.');
                return;
            }
            
            // Get all unique headers from filtered documents
            const allHeaders = new Set();
            filteredDocuments.forEach(doc => {
                Object.keys(doc).forEach(key => allHeaders.add(key));
            });
            const headers = Array.from(allHeaders).sort();
            
            const csvContent = [
                headers.join(','),
                ...filteredDocuments.map(doc => 
                    headers.map(header => {
                        const value = doc[header] || '';
                        return `"${value.toString().replace(/"/g, '""')}"`;
                    }).join(',')
                )
            ].join('\n');
            
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Kalkınma Planları_documents.csv';
            link.click();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            try {
                if (typeof embeddedData !== 'undefined') {
                    allDocuments = embeddedData;
                    filteredDocuments = [...allDocuments];
                    populateCategoryFilter();
                    renderDocuments(filteredDocuments);
                    updateStats();
                    
                    document.getElementById('searchBox').addEventListener('input', filterDocuments);
                    document.getElementById('yearFilter').addEventListener('input', filterDocuments);
                    document.getElementById('categoryFilter').addEventListener('change', filterDocuments);
                } else {
                    document.getElementById('loading').textContent = 'Veri yüklenirken hata oluştu.';
                }
            } catch (error) {
                console.error('Error during initialization:', error);
                document.getElementById('loading').textContent = 'Veri yüklenirken hata oluştu.';
            }
        });
    </script>
