<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birincil Enerjinin Kaynaklara Göre Üretimi ve Tüketimi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: white;
            color: #333;
            line-height: 1.6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .main-container {
            max-width: 1600px;
            width: 95%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .header {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
            color: white !important;
            /* Force white color in WordPress */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
            font-size: 1.1rem;
            color: white !important;
            /* Force white color in WordPress */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .content-layout {
            display: flex;
            gap: 0;
        }

        .filters-panel {
            width: 350px;
            background: #f8f9fa;
            padding: 2rem;
            border-right: 1px solid #e9ecef;
        }

        .content-panel {
            flex: 1;
            padding: 2rem;
            min-width: 0;
        }

        .filter-group {
            margin-bottom: 2rem;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: #006400;
            font-size: 1rem;
        }

        .year-range-container {
            margin: 1.5rem 0;
        }

        .year-inputs {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }

        .year-inputs input {
            width: 80px;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
        }

        .year-inputs span {
            color: #666;
            font-weight: 500;
        }

        #yearRangeSlider {
            margin: 1.5rem 0;
        }

        #yearRangeSlider .noUi-connect {
            background: #006400;
        }

        #yearRangeSlider .noUi-handle {
            border-color: #006400;
            background: #fff;
        }

        .series-checkboxes {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: white;
            margin-bottom: 1.5rem;
        }

        .checkbox-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #006400;
            transform: scale(1.1);
        }

        /* Hierarchical category styling */
        .category-group {
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fafafa;
        }

        .category-group-header {
            background: #f0f0f0;
            padding: 12px 15px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            display: flex;
            justify-content: between;
            align-items: center;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }

        .category-group-header:hover {
            background: #e8e8e8;
        }

        .category-group-toggle {
            font-size: 12px;
            color: #666;
            margin-left: auto;
        }

        .category-group-content {
            padding: 15px;
            display: block;
        }

        .category-group-content.collapsed {
            display: none;
        }

        .parent-category {
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 8px;
        }

        .sub-category {
            margin-left: 20px;
            font-size: 14px;
            color: #555;
        }

        .sub-category input[type="checkbox"] {
            transform: scale(0.9);
            accent-color: #006400;
        }

        .category-total {
            font-weight: bold;
            color: #d63384;
            background: #fff5f5;
            padding: 4px 8px;
            border-radius: 3px;
            margin-left: 20px;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
            flex: 1;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-buttons button {
            flex: 1;
            padding: 0.7rem;
            background: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .filter-buttons button:hover {
            background: #006400;
            color: white;
            border-color: #006400;
        }

        .search-input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-button {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            color: #006400;
            background: #f8f9fa;
        }

        .tab-button.active {
            color: #006400;
            border-bottom-color: #006400;
            background: #f8f9fa;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chart-container {
            position: relative;
            height: 500px;
            margin: 1.5rem 0;
            background: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            background: white;
            scrollbar-width: thin;
            scrollbar-color: #006400 #f1f1f1;
        }

        .table-container::-webkit-scrollbar {
            height: 12px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #006400;
            border-radius: 6px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #004d00;
        }

        .top-scrollbar-container {
            width: 100%;
            height: 12px;
            margin-bottom: 5px;
            overflow: hidden;
            border-radius: 6px;
            background: #f1f1f1;
        }

        .top-scrollbar {
            width: 100%;
            height: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #006400 #f1f1f1;
        }

        .top-scrollbar::-webkit-scrollbar {
            height: 12px;
        }

        .top-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }

        .top-scrollbar::-webkit-scrollbar-thumb {
            background: #006400;
            border-radius: 6px;
        }

        .top-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #004d00;
        }

        .top-scrollbar-thumb {
            height: 1px;
            background: transparent;
        }

        .data-table {
            border-collapse: collapse;
            min-width: 2500px;
            background: white;
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #006400;
        }

        .data-table tbody tr:nth-child(odd) {
            background: #fbfcfd;
        }

        .data-table tbody tr:hover {
            background: #f0f8f0;
        }

        /* Category group separation in tables */
        .table-group-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%) !important;
            font-weight: bold;
            color: #006400;
            font-size: 0.9rem;
            border-top: 2px solid #006400;
            border-bottom: 1px solid #dee2e6;
        }

        .table-group-header .sticky-col {
            background: linear-gradient(135deg, #f0f8f0 0%, #e8f5e8 100%) !important;
            font-style: italic;
            text-align: left !important;
            font-weight: bold;
            color: #006400;
            border-right: 1px solid #dee2e6;
        }

        .table-group-header td:not(.sticky-col) {
            background: #f8f9fa !important;
        }

        .table-category-item {
            border-left: 3px solid transparent;
        }

        .table-category-item.energy-supply {
            border-left-color: #28a745;
        }

        .table-category-item.transformation {
            border-left-color: #fd7e14;
        }

        .table-category-item.industry {
            border-left-color: #dc3545;
        }

        .table-category-item.other-sectors {
            border-left-color: #6f42c1;
        }

        .table-category-item.totals {
            border-left-color: #343a40;
            background: #f8f9fa;
            font-weight: 500;
        }

        .sticky-col {
            position: sticky;
            left: 0;
            background: #f8f9fa;
            z-index: 2;
            box-shadow: 2px 0 4px rgba(0, 0, 0, 0.1);
            width: 250px;
            max-width: 250px;
            min-width: 250px;
        }

        .red-value {
            color: #dc3545;
            font-style: italic;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }

        .download-buttons button {
            padding: 0.8rem 1.2rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0, 100, 0, 0.2);
        }

        .download-buttons button:hover {
            background: #004d00;
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(0, 100, 0, 0.3);
        }

        .chart-download {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }

        .chart-download button {
            padding: 0.8rem 1.5rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0, 100, 0, 0.2);
        }

        .chart-download button:hover {
            background: #004d00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 100, 0, 0.3);
        }

        .calculation-mode {
            margin: 1rem 0;
            padding: 1rem;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .calculation-mode label:first-child {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.8rem;
            text-align: center;
        }

        .mode-options {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-options label {
            padding: 0.5rem 1rem;
            margin: 0;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #006400;
            background: white;
            border: 2px solid #006400;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0, 100, 0, 0.1);
            min-width: 80px;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
        }

        .mode-options label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 100, 0, 0.2);
            background: #f0f8f0;
        }

        .mode-options input[type="radio"] {
            display: none;
        }

        .mode-options input[type="radio"]:checked+label {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 100, 0, 0.3);
        }



        .no-data-message {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .content-layout {
                flex-direction: column;
            }

            .filters-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .year-inputs {
                flex-direction: column;
                gap: 0.5rem;
            }

            .download-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>Birincil Enerjinin Kaynaklara Göre Üretimi ve Tüketimi</h1>
            <p style="margin-top: 0.5rem; opacity: 0.9;">Enerji Dengesi Tablosu (Bin TEP)</p>
        </div>

        <div class="content-layout">
            <div class="filters-panel">
                <!-- Resource Selector (for 2D filtering) -->
                <div class="filter-group">
                    <label>Enerji Kaynağı</label>
                    <select id="resourceSelect" class="search-input" style="width: 100%; padding: 0.6rem;">
                        <option value="Toplam" selected>Toplam</option>
                        <!-- More options populated by JS if new data format exists -->
                    </select>
                    <small style="color: #666; font-size: 0.8rem; display: block; margin-top: 0.5rem;">
                        Zaman serisi için kaynak seçin
                    </small>
                </div>

                <div class="filter-group">
                    <label>Yıl Aralığı</label>
                    <div class="year-range-container">
                        <div id="yearRangeSlider"></div>
                        <div class="year-inputs">
                            <input type="number" id="yearInputStart" min="1972" max="2023" value="1972">
                            <span>-</span>
                            <input type="number" id="yearInputEnd" min="1972" max="2023" value="2023">
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Veri Serileri (Sektörler)</label>
                    <input type="text" id="seriesSearch" class="search-input" placeholder="Sektör ara...">
                    <div class="filter-buttons">
                        <button id="selectAllBtn">Hepsini Seç</button>
                        <button id="deselectAllBtn">Hiçbirini Seçme</button>
                    </div>
                    <div id="seriesCheckboxes" class="series-checkboxes"></div>

                    <div class="download-buttons">
                        <button id="downloadFullData">Tam Veriyi İndir</button>
                        <button id="downloadFilteredData">Filtrelenmiş Veriyi İndir</button>
                    </div>
                </div>
            </div>

            <div class="content-panel">
                <div class="tabs">
                    <button class="tab-button" data-tab="balance">Denge Tablosu</button>
                    <button class="tab-button active" data-tab="table">Zaman Serisi</button>
                    <button class="tab-button" data-tab="line">Çizgi Grafik</button>
                    <button class="tab-button" data-tab="bar">Sütun Grafik</button>
                    <button class="tab-button" data-tab="pie">Pasta Grafik</button>
                </div>

                <!-- NEW: Balance Sheet Tab (2D Matrix for single year) -->
                <div id="balanceContent" class="tab-content">
                    <div style="margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
                        <label style="font-weight: 600; color: #006400;">Görüntülenen Yıl:</label>
                        <select id="balanceYearSelect"
                            style="padding: 0.5rem 1rem; border: 2px solid #006400; border-radius: 6px; font-size: 1rem;">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div class="table-container" id="balanceTableContainer">
                        <div id="balanceTable"></div>
                    </div>
                </div>

                <!-- Time Series Table (existing, filtered by Resource) -->
                <div id="tableContent" class="tab-content active">
                    <div class="top-scrollbar-container">
                        <div class="top-scrollbar">
                            <div class="top-scrollbar-thumb"></div>
                        </div>
                    </div>
                    <div class="table-container" id="mainTableContainer">
                        <div id="tableContainer"></div>
                    </div>
                </div>

                <div id="lineContent" class="tab-content">
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                    <div id="lineLegendContainer"
                        style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; display: none;">
                        <div style="font-weight: bold; margin-bottom: 10px; color: #333;">Veri Serileri:</div>
                        <div id="lineLegendContent"
                            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px;">
                        </div>
                    </div>
                    <div class="chart-download">
                        <button id="downloadLineChart">Çizgi Grafiği İndir</button>
                    </div>
                </div>

                <div id="barContent" class="tab-content">
                    <div class="calculation-mode">
                        <label>Hesaplama Türü</label>
                        <div class="mode-options">
                            <input type="radio" id="mode-sum" name="barChartMode" value="sum" checked>
                            <label for="mode-sum">Toplam</label>
                            <input type="radio" id="mode-average" name="barChartMode" value="average">
                            <label for="mode-average">Ortalama</label>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                    <div class="chart-download">
                        <button id="downloadBarChart">Sütun Grafiği İndir</button>
                    </div>
                </div>

                <div id="pieContent" class="tab-content">
                    <div class="calculation-mode">
                        <label>Hesaplama Türü</label>
                        <div class="mode-options">
                            <input type="radio" id="pie-mode-sum" name="pieChartMode" value="sum" checked>
                            <label for="pie-mode-sum">Toplam</label>
                            <input type="radio" id="pie-mode-average" name="pieChartMode" value="average">
                            <label for="pie-mode-average">Ortalama</label>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div id="pieLegendContainer"
                        style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; display: none;">
                        <div style="font-weight: bold; margin-bottom: 10px; color: #333;">Kategori Dağılımı:</div>
                        <div id="pieLegendContent"
                            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px;">
                        </div>
                    </div>
                    <div class="chart-download">
                        <button id="downloadPieChart">Pasta Grafiği İndir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let embeddedDataA = [];
    </script>
    <script src="data/a/data_a_embedded.js"></script>

                rows: [
                    { Kategori: "Yerli Üretim (+)", values: [1100, 17800, 420, 2600, 350, 0, 6800, 5100, 6500, 12500, 1400, 900, 0, 0, 55470] },
                    { Kategori: "İthalat (+)", values: [17500, 0, 0, 42000, 48000, 0, 0, 0, 0, 0, 250, 0, 1800, 0, 109550] },
                    { Kategori: "İhracat (-)", values: [0, 0, 0, -4800, 0, 0, 0, 0, 0, 0, 0, 0, -3500, 0, -8300] },
                    { Kategori: "ENERJİ ÜRÜNLERİ ARZI", values: [18600, 17800, 420, 39800, 48350, 0, 6800, 5100, 6500, 12500, 1650, 900, -1700, 0, 156720] },
                    { Kategori: "Elektrik ve Isı Üretimi", values: [-14500, -16500, -380, -1100, -23000, 0, -6800, -5100, -6500, -12500, -600, -800, 88000, 3500, 2720] },
                    { Kategori: "TOPLAM NİHAİ TÜKETİM", values: [4100, 1300, 40, 36500, 25000, 0, 0, 0, 0, 0, 1050, 100, 86300, 3500, 157890] },
                    { Kategori: "SANAYİ TÜKETİMİ", values: [3700, 1100, 35, 8000, 14500, 0, 0, 0, 0, 0, 350, 75, 43500, 1900, 73160] },
                    { Kategori: "ULAŞTIRMA", values: [0, 0, 0, 27000, 180, 0, 0, 0, 0, 0, 600, 0, 850, 0, 28630] },
                    { Kategori: "Konut ve Hizmetler", values: [400, 200, 5, 1100, 10000, 0, 0, 0, 0, 0, 100, 25, 39000, 1600, 52430] }
                ]
            }
        };
    </script>

    <script>
        // Global variables
        let yearSlider = null;
        let lineChart = null;
        let barChart = null;
        let pieChart = null;
        let currentFilteredData = [];
        let allYears = [];
        let allResources = ['Toplam'];
        let selectedResource = 'Toplam';
        let colorIndex = 0;
        let startYear = 1972;
        let endYear = 2023;
        let balanceYear = 2023;
        let isNewDataFormat = false;

        const materialColors = [
            '#FF9800', '#795548', '#9E9E9E', '#607D8B', '#4CAF50',
            '#2196F3', '#9C27B0', '#F44336', '#00BCD4', '#CDDC39',
            '#FFC107', '#673AB7', '#00E676', '#FF6D00', '#37474F',
            '#B71C1C', '#1E88E5', '#FB8C00', '#43A047', '#E53935'
        ];

        function getNextMaterialColor() {
            const color = materialColors[colorIndex % materialColors.length];
            colorIndex++;
            return color;
        }

        function formatTableNumber(value) {
            if (value === null || value === undefined || value === '') return '';
            const num = parseFloat(value);
            return num.toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        }

        function parseRedValue(value) {
            if (value === null || value === undefined) return null;
            if (typeof value === 'object' && value.is_red && typeof value.value === 'number') {
                return value.value;
            }
            if (typeof value === 'string' && value.startsWith('(') && value.endsWith(')')) {
                return parseFloat(value.slice(1, -1)) || 0;
            }
            return parseFloat(value) || 0;
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Detect data format
            if (typeof embeddedDataA !== 'undefined') {
                if (Array.isArray(embeddedDataA)) {
                    // Old format: array of {Kategori, year: value, ...}
                    isNewDataFormat = false;
                    initializeWithOldFormat(embeddedDataA);
                } else {
                    // New format: {year: {columns, rows}}
                    isNewDataFormat = true;
                    initializeWithNewFormat(embeddedDataA);
                }
            } else {
                showNoDataMessage();
            }
        });

        function initializeWithOldFormat(data) {
            if (data.length === 0) { showNoDataMessage(); return; }

            // Extract years
            allYears = [];
            data.forEach(item => {
                Object.keys(item).forEach(key => {
                    if (key !== 'Kategori' && !isNaN(parseInt(key))) {
                        const year = parseInt(key);
                        if (!allYears.includes(year)) allYears.push(year);
                    }
                });
            });
            allYears.sort((a, b) => a - b);

            if (allYears.length > 0) {
                startYear = allYears[0];
                endYear = allYears[allYears.length - 1];
                balanceYear = allYears[allYears.length - 1];
            }

            currentFilteredData = data;
            allResources = ['Toplam']; // Only Total available in old format

            initializeUI();

            // Populate balance year selector with mock data years for demo
            populateBalanceYearSelect(Object.keys(mockBalanceData).sort());
        }

        function initializeWithNewFormat(data) {
            allYears = Object.keys(data).map(y => parseInt(y)).sort((a, b) => a - b);

            if (allYears.length === 0) { showNoDataMessage(); return; }

            startYear = allYears[0];
            endYear = allYears[allYears.length - 1];
            balanceYear = allYears[allYears.length - 1];

            // Extract resources from first year
            const firstYear = allYears[0].toString();
            allResources = data[firstYear].columns || ['Toplam'];

            // Convert to old format for charts (using selected resource)
            rebuildFilteredDataFromNewFormat(data);

            initializeUI();
            populateBalanceYearSelect(allYears.map(String));
        }

        function rebuildFilteredDataFromNewFormat(data) {
            const resourceIndex = allResources.indexOf(selectedResource);
            if (resourceIndex === -1) return;

            currentFilteredData = [];
            const firstYear = allYears[0].toString();
            const categories = data[firstYear].rows.map(r => r.Kategori);

            categories.forEach(cat => {
                const item = { Kategori: cat };
                allYears.forEach(year => {
                    const yearData = data[year.toString()];
                    if (yearData) {
                        const row = yearData.rows.find(r => r.Kategori === cat);
                        if (row && row.values[resourceIndex] !== undefined) {
                            item[year] = row.values[resourceIndex];
                        }
                    }
                });
                currentFilteredData.push(item);
            });
        }

        function initializeUI() {
            initializeFilters();
            initializeEventListeners();
            populateSeriesFilter();
            populateResourceSelect();
            applyFiltersAndRender();
            renderBalanceTable();
        }

        function showNoDataMessage() {
            document.querySelector('.content-panel').innerHTML = '<div class="no-data-message"><h3>Veri Yüklenemedi</h3></div>';
        }

        function populateResourceSelect() {
            const select = document.getElementById('resourceSelect');
            select.innerHTML = '';
            allResources.forEach(res => {
                const option = document.createElement('option');
                option.value = res;
                option.textContent = res;
                if (res === 'Toplam') option.selected = true;
                select.appendChild(option);
            });
        }

        function populateBalanceYearSelect(years) {
            const select = document.getElementById('balanceYearSelect');
            select.innerHTML = '';
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                select.appendChild(option);
            });
            select.value = years[years.length - 1];
            balanceYear = parseInt(years[years.length - 1]);
        }

        function initializeFilters() {
            const yearRangeSlider = document.getElementById('yearRangeSlider');
            noUiSlider.create(yearRangeSlider, {
                start: [startYear, endYear],
                connect: true,
                range: { 'min': allYears[0] || 1972, 'max': allYears[allYears.length - 1] || 2023 },
                step: 1,
                format: { to: v => Math.round(v), from: v => Number(v) }
            });

            yearRangeSlider.noUiSlider.on('update', function (values) {
                startYear = parseInt(values[0]);
                endYear = parseInt(values[1]);
                document.getElementById('yearInputStart').value = startYear;
                document.getElementById('yearInputEnd').value = endYear;
            });

            yearRangeSlider.noUiSlider.on('set', function () { applyFiltersAndRender(); });
            yearSlider = yearRangeSlider;
        }

        function initializeEventListeners() {
            document.getElementById('yearInputStart').addEventListener('change', handleYearInputChange);
            document.getElementById('yearInputEnd').addEventListener('change', handleYearInputChange);

            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', function () { switchTab(this.getAttribute('data-tab')); });
            });

            document.getElementById('selectAllBtn').addEventListener('click', function () {
                document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]').forEach(cb => cb.checked = true);
                applyFiltersAndRender();
            });

            document.getElementById('deselectAllBtn').addEventListener('click', function () {
                document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
                applyFiltersAndRender();
            });

            document.getElementById('seriesSearch').addEventListener('input', function () {
                const searchTerm = this.value.toLowerCase().trim();
                document.querySelectorAll('#seriesCheckboxes .checkbox-item').forEach(item => {
                    const label = item.querySelector('label');
                    if (label) item.style.display = label.textContent.toLowerCase().includes(searchTerm) ? 'flex' : 'none';
                });
            });

            document.getElementById('resourceSelect').addEventListener('change', function () {
                selectedResource = this.value;
                // If new format, rebuild data for selected resource
                if (isNewDataFormat && typeof embeddedDataA !== 'undefined') {
                    rebuildFilteredDataFromNewFormat(embeddedDataA);
                }
                applyFiltersAndRender();
            });

            document.getElementById('balanceYearSelect').addEventListener('change', function () {
                balanceYear = parseInt(this.value);
                renderBalanceTable();
            });

            document.querySelectorAll('input[name="barChartMode"]').forEach(radio => {
                radio.addEventListener('change', function () { if (this.checked) renderBarChart(); });
            });

            document.querySelectorAll('input[name="pieChartMode"]').forEach(radio => {
                radio.addEventListener('change', function () { if (this.checked) renderPieChart(); });
            });

            document.getElementById('downloadFullData').addEventListener('click', () => downloadData('full'));
            document.getElementById('downloadFilteredData').addEventListener('click', () => downloadData('filtered'));
            document.getElementById('downloadLineChart').addEventListener('click', () => downloadChart('lineChart', 'cizgi_grafik.png'));
            document.getElementById('downloadBarChart').addEventListener('click', () => downloadChart('barChart', 'sutun_grafik.png'));
            document.getElementById('downloadPieChart').addEventListener('click', () => downloadChart('pieChart', 'pasta_grafik.png'));
        }

        function handleYearInputChange() {
            const start = parseInt(document.getElementById('yearInputStart').value);
            const end = parseInt(document.getElementById('yearInputEnd').value);
            if (!isNaN(start) && !isNaN(end) && start <= end) {
                yearSlider.noUiSlider.set([start, end]);
                startYear = start;
                endYear = end;
                applyFiltersAndRender();
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}Content`).classList.add('active');

            if (tabName === 'line') renderLineChart();
            else if (tabName === 'bar') renderBarChart();
            else if (tabName === 'pie') renderPieChart();
            else if (tabName === 'balance') renderBalanceTable();
        }

        function populateSeriesFilter() {
            const container = document.getElementById('seriesCheckboxes');
            container.innerHTML = '';
            const data = typeof embeddedDataA !== 'undefined' && Array.isArray(embeddedDataA) ? embeddedDataA : currentFilteredData;

            // Define hierarchical structure for primary energy categories
            const categoryHierarchy = {
                'Enerji Arzı': {
                    title: 'Enerji Arzı',
                    categories: ['Yerli Üretim (+)', 'İthalat (+)', 'İhracat (-)', 'İhrakiye (-)', 'Stok Değişimi (+/-)', 'İstatistik Hata (+/-)'],
                    totals: ['ENERJİ ÜRÜNLERİ ARZI']
                },
                'Çevrim ve Enerji Sektörü': {
                    title: 'Çevrim ve Enerji Sektörü',
                    categories: ['Elektrik ve Isı Üretimi', 'İkincil Kömür Üreten/Tüketen Tesisler', 'Petrol Rafinerileri', 'İç Tüketim ve Kayıp'],
                    totals: ['ÇEVRİM VE ENERJİ SEKTÖRÜ']
                },
                'Sanayi Tüketimi': {
                    title: 'Sanayi Tüketimi',
                    categories: ['Gıda', 'Şeker', 'Tekstil', 'Kağıt', 'Kimya-Petrokimya', 'Gübre', 'Cam ve Cam Ürünleri', 'Seramik', 'Çimento', 'Demir-Çelik', 'Demir Dışı Metaller', 'Motorlu Kara Taşıtları Sanayi', 'Diğer Sanayi'],
                    totals: ['SANAYİ TÜKETİMİ']
                },
                'Ulaştırma': {
                    title: 'Ulaştırma',
                    categories: ['Demiryolları', 'Denizyolları', 'Havayolları', 'Boru Hatları', 'Karayolları'],
                    totals: ['ULAŞTIRMA']
                },
                'Diğer Sektörler': {
                    title: 'Diğer Sektörler',
                    categories: ['Konut ve Hizmetler', 'Tarım ve Hayvancılık'],
                    totals: ['DİĞER SEKTÖRLER']
                },
                'Enerji Dışı Tüketim': {
                    title: 'Enerji Dışı Tüketim',
                    categories: ['Petro Kimya Feedstock', 'Diğer'],
                    totals: ['ENERJİ DIŞI TÜKETİM']
                },
                'Genel Toplamlar': {
                    title: 'Genel Toplamlar',
                    categories: ['İstatistiksel Fark (+/-)'],
                    totals: ['TOPLAM NİHAİ ENERJİ TÜKETİMİ', 'SEKTÖRLER TOPLAMI']
                }
            };

            // Get available categories from data
            const availableCategories = data.map(item => item.Kategori);

            Object.keys(categoryHierarchy).forEach(groupKey => {
                const group = categoryHierarchy[groupKey];

                // Check which categories in this group are available
                const groupCategories = group.categories.filter(cat => availableCategories.includes(cat));
                const groupTotals = group.totals.filter(cat => availableCategories.includes(cat));

                if (groupCategories.length === 0 && groupTotals.length === 0) return;

                // Create group container
                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';

                // Create group header
                const headerDiv = document.createElement('div');
                headerDiv.className = 'category-group-header';
                headerDiv.innerHTML = `
                    <span>${group.title}</span>
                    <span class="category-group-toggle">▼</span>
                `;

                // Toggle functionality
                headerDiv.addEventListener('click', () => {
                    const content = groupDiv.querySelector('.category-group-content');
                    const toggle = headerDiv.querySelector('.category-group-toggle');
                    if (content.classList.contains('collapsed')) {
                        content.classList.remove('collapsed');
                        toggle.textContent = '▼';
                    } else {
                        content.classList.add('collapsed');
                        toggle.textContent = '▶';
                    }
                });

                // Create content container
                const contentDiv = document.createElement('div');
                contentDiv.className = 'category-group-content';

                // Add group total categories first (they are the main headers)
                groupTotals.forEach(category => {
                    const item = data.find(d => d.Kategori === category);
                    if (item) {
                        const categoryDiv = document.createElement('div');
                        categoryDiv.className = 'checkbox-item category-total';

                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = `series-${category.replace(/[^a-zA-Z0-9]/g, '_')}`;
                        checkbox.value = category;
                        checkbox.addEventListener('change', applyFiltersAndRender);
                        checkbox.checked = true;

                        const label = document.createElement('label');
                        label.htmlFor = checkbox.id;
                        label.textContent = category;

                        categoryDiv.appendChild(checkbox);
                        categoryDiv.appendChild(label);
                        contentDiv.appendChild(categoryDiv);
                    }
                });

                // Add individual sub-categories
                groupCategories.forEach(category => {
                    const item = data.find(d => d.Kategori === category);
                    if (item) {
                        const categoryDiv = document.createElement('div');
                        categoryDiv.className = 'checkbox-item sub-category';

                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = `series-${category.replace(/[^a-zA-Z0-9]/g, '_')}`;
                        checkbox.value = category;
                        checkbox.addEventListener('change', applyFiltersAndRender);
                        checkbox.checked = true;

                        const label = document.createElement('label');
                        label.htmlFor = checkbox.id;
                        label.textContent = category;

                        categoryDiv.appendChild(checkbox);
                        categoryDiv.appendChild(label);
                        contentDiv.appendChild(categoryDiv);
                    }
                });

                groupDiv.appendChild(headerDiv);
                groupDiv.appendChild(contentDiv);
                container.appendChild(groupDiv);
            });
        }

        function applyFiltersAndRender() {
            const selectedSeries = Array.from(document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]:checked')).map(cb => cb.value);

            if (selectedSeries.length === 0) {
                currentFilteredData = [];
                renderTable();
                clearCharts();
                return;
            }

            const data = typeof embeddedDataA !== 'undefined' && Array.isArray(embeddedDataA) ? embeddedDataA : currentFilteredData;
            const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);

            currentFilteredData = selectedSeries.map(seriesName => {
                const seriesData = data.find(item => item.Kategori === seriesName);
                if (!seriesData) return null;
                const result = { Kategori: seriesName };
                yearsInRange.forEach(year => { result[year] = seriesData[year]; });
                return result;
            }).filter(item => item !== null);

            renderTable();
            renderLineChart();
            renderBarChart();
            renderPieChart();
        }

        // NEW: Render Balance Sheet (2D Matrix)
        function renderBalanceTable() {
            const container = document.getElementById('balanceTable');

            // Use mock data for demo (or real data if new format)
            const data = isNewDataFormat && typeof embeddedDataA !== 'undefined' ?
                embeddedDataA[balanceYear.toString()] : mockBalanceData[balanceYear.toString()];

            if (!data) {
                container.innerHTML = '<div class="no-data-message">Bu yıl için denge tablosu verisi yok.</div>';
                return;
            }

            let html = '<table class="data-table balance-table"><thead><tr><th class="sticky-col">Sektör / Akış</th>';
            data.columns.forEach(col => { html += `<th>${col}</th>`; });
            html += '</tr></thead><tbody>';

            data.rows.forEach(row => {
                const isHeader = row.Kategori === row.Kategori.toUpperCase();
                const rowClass = isHeader ? 'section-header' : '';
                html += `<tr class="${rowClass}"><td class="sticky-col">${row.Kategori}</td>`;
                row.values.forEach(val => {
                    let displayValue = '';
                    let cellClass = '';

                    if (val === null || val === undefined) {
                        // Null/undefined values should show as empty
                        displayValue = '';
                    } else if (typeof val === 'object' && val !== null && 'value' in val) {
                        // Handle {value: X, is_red: true/false} format
                        const num = parseFloat(val.value) || 0;
                        displayValue = formatTableNumber(num);
                        if (val.is_red) {
                            cellClass = 'red-value';
                        }
                        if (num < 0) {
                            cellClass += ' negative-value';
                        }
                    } else {
                        // Regular number
                        const num = parseFloat(val) || 0;
                        displayValue = formatTableNumber(num);
                        if (num < 0) {
                            cellClass = 'negative-value';
                        }
                    }
                    html += `<td class="${cellClass.trim()}">${displayValue}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';

            // Add note about mock data
            if (!isNewDataFormat) {
                html += '<p style="color: #666; font-size: 0.85rem; margin-top: 1rem; font-style: italic;">* Örnek veri gösterilmektedir. Gerçek veriyi görmek için excel_to_html_converter.py dosyasını çalıştırın.</p>';
            }

            container.innerHTML = html;
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            if (currentFilteredData.length === 0) {
                container.innerHTML = '<div class="no-data-message">Gösterilecek veri yok.</div>';
                return;
            }

            const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
            let html = '<table class="data-table"><thead><tr><th class="sticky-col">Kategori</th>';
            yearsInRange.forEach(year => { html += `<th>${year}</th>`; });
            html += '</tr></thead><tbody>';

            currentFilteredData.forEach(item => {
                html += `<tr><td class="sticky-col">${item.Kategori}</td>`;
                yearsInRange.forEach(year => {
                    const value = item[year];
                    let displayValue = '', className = '';
                    if (value !== null && value !== undefined) {
                        if (typeof value === 'object' && value.is_red) {
                            displayValue = formatTableNumber(value.value);
                            className = 'red-value';
                        } else {
                            displayValue = formatTableNumber(value);
                        }
                    }
                    html += `<td class="${className}">${displayValue}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderLineChart() {
            const canvas = document.getElementById('lineChart');
            const ctx = canvas.getContext('2d');
            if (lineChart) lineChart.destroy();
            if (currentFilteredData.length === 0) return;

            const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
            colorIndex = 0;

            const datasets = currentFilteredData.map(item => {
                const data = yearsInRange.map(year => parseRedValue(item[year]));
                const color = getNextMaterialColor();
                return { label: item.Kategori, data: data, borderColor: color, backgroundColor: 'transparent', borderWidth: 2.5, fill: false, tension: 0.15, pointRadius: 0 };
            });

            lineChart = new Chart(ctx, {
                type: 'line',
                data: { labels: yearsInRange, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: `Değer (Bin TEP) - ${selectedResource}` } },
                        x: { title: { display: true, text: 'Yıl' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            createLineLegend(datasets);
        }

        function createLineLegend(datasets) {
            const legendContainer = document.getElementById('lineLegendContainer');
            const legendContent = document.getElementById('lineLegendContent');
            legendContainer.style.display = 'block';
            legendContent.innerHTML = '';

            datasets.forEach((dataset, index) => {
                const legendItem = document.createElement('div');
                legendItem.style.cssText = 'display: flex; align-items: center; padding: 10px 15px; border-radius: 8px; cursor: pointer; background: white; border: 2px solid #e0e0e0;';
                legendItem.innerHTML = `<div style="width: 40px; height: 4px; background-color: ${dataset.borderColor}; border-radius: 2px; margin-right: 12px;"></div><div style="font-weight: 500; color: #333;">${dataset.label}</div>`;
                legendItem.addEventListener('click', () => {
                    const meta = lineChart.getDatasetMeta(index);
                    meta.hidden = meta.hidden === null ? !lineChart.data.datasets[index].hidden : null;
                    lineChart.update();
                    legendItem.style.opacity = meta.hidden ? '0.5' : '1';
                });
                legendContent.appendChild(legendItem);
            });
        }

        function renderBarChart() {
            const canvas = document.getElementById('barChart');
            const ctx = canvas.getContext('2d');
            if (barChart) barChart.destroy();
            if (currentFilteredData.length === 0) return;

            const calculationMode = document.querySelector('input[name="barChartMode"]:checked').value;
            const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
            colorIndex = 0;

            const chartData = currentFilteredData.map(item => {
                const yearValues = yearsInRange.map(year => parseRedValue(item[year])).filter(v => v !== null);
                let value = 0;
                if (yearValues.length > 0) {
                    value = calculationMode === 'sum' ? yearValues.reduce((sum, v) => sum + v, 0) : yearValues.reduce((sum, v) => sum + v, 0) / yearValues.length;
                }
                return { label: item.Kategori, value: value, color: getNextMaterialColor() };
            });

            barChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: chartData.map(item => item.label), datasets: [{ label: calculationMode === 'sum' ? 'Toplam' : 'Ortalama', data: chartData.map(item => item.value), backgroundColor: chartData.map(item => item.color) }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
            });
        }

        function renderPieChart() {
            const canvas = document.getElementById('pieChart');
            const ctx = canvas.getContext('2d');
            if (pieChart) pieChart.destroy();
            if (currentFilteredData.length === 0) return;

            const calculationMode = document.querySelector('input[name="pieChartMode"]:checked').value;
            const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
            colorIndex = 0;

            const chartData = currentFilteredData.map(item => {
                const yearValues = yearsInRange.map(year => parseRedValue(item[year])).filter(v => v !== null && v > 0);
                let value = 0;
                if (yearValues.length > 0) {
                    value = calculationMode === 'sum' ? yearValues.reduce((sum, v) => sum + v, 0) : yearValues.reduce((sum, v) => sum + v, 0) / yearValues.length;
                }
                return { label: item.Kategori, value: value, color: getNextMaterialColor() };
            }).filter(item => item.value > 0);

            pieChart = new Chart(ctx, {
                type: 'pie',
                data: { labels: chartData.map(item => item.label), datasets: [{ data: chartData.map(item => item.value), backgroundColor: chartData.map(item => item.color) }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
            createPieLegend(chartData);
        }

        function createPieLegend(chartData) {
            const legendContainer = document.getElementById('pieLegendContainer');
            const legendContent = document.getElementById('pieLegendContent');
            legendContainer.style.display = 'block';
            legendContent.innerHTML = '';

            chartData.forEach((item) => {
                const legendItem = document.createElement('div');
                legendItem.style.cssText = 'display: flex; align-items: center; padding: 8px 12px; border-radius: 6px; background: white; border: 1px solid #e0e0e0;';
                legendItem.innerHTML = `<div style="width: 12px; height: 12px; background-color: ${item.color}; border-radius: 2px; margin-right: 8px;"></div><div style="font-size: 13px; color: #333;">${item.label}</div>`;
                legendContent.appendChild(legendItem);
            });
        }

        function clearCharts() {
            if (lineChart) { lineChart.destroy(); lineChart = null; }
            if (barChart) { barChart.destroy(); barChart = null; }
            if (pieChart) { pieChart.destroy(); pieChart = null; }
        }

        function downloadData(type) {
            let data, filename;
            if (type === 'full') {
                const allData = typeof embeddedDataA !== 'undefined' && Array.isArray(embeddedDataA) ? embeddedDataA : currentFilteredData;
                data = convertToCSV(allData, allYears);
                filename = 'birincil_enerji_tam_veri.csv';
            } else {
                if (currentFilteredData.length === 0) { alert('İndirilecek filtrelenmiş veri yok.'); return; }
                const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
                data = convertToCSV(currentFilteredData, yearsInRange);
                filename = `birincil_enerji_filtreli_${startYear}_${endYear}.csv`;
            }
            triggerDownload(data, filename);
        }

        function convertToCSV(data, years) {
            const headers = ['Kategori', ...years.map(String)];
            const rows = [headers];
            data.forEach(item => {
                const row = [item.Kategori];
                years.forEach(year => {
                    let value = parseRedValue(item[year]);
                    if (value === null || value === undefined) value = '';
                    row.push(value);
                });
                rows.push(row);
            });
            return rows.map(row => row.map(cell => { const str = String(cell); return str.includes(',') ? `"${str}"` : str; }).join(',')).join('\r\n');
        }

        function triggerDownload(csvData, filename) {
            const blob = new Blob(['\uFEFF' + csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadChart(chartId, filename) {
            const canvas = document.getElementById(chartId);
            if (!canvas) { alert('Grafik bulunamadı.'); return; }
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
