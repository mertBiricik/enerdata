        }

            background: linear-gradient(135deg, #006400 0%, #228B22 100%);

            padding: 2rem;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
            color: white !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

            font-size: 1.1rem;
            opacity: 0.9;
            color: white !important;
        }
        
        .controls {
            padding: 1.5rem;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        
        .search-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        .search-box, .date-filter {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .search-box:focus, .date-filter:focus {
            outline: none;
            border-color: #228B22;
        }
        
        .stats {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
            flex-wrap: wrap;
        }
        
        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
        }
        
        .documents-container {
            padding: 1.5rem;
            max-height: 800px;
            overflow-y: auto;
        }
        
        .document-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 1rem;
            padding: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .document-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .document-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .document-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .meta-item {
            display: flex;
            gap: 0.5rem;
        }
        
        .meta-label {
            font-weight: 600;
            color: #666;
            min-width: 80px;
        }
        
        .meta-value {
            color: #333;
        }
        
        .document-purpose {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #228B22;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
        }
        
        .access-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .access-link:hover {
            transform: translateY(-1px);
            text-decoration: none;
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .search-container {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .document-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>

        let allDocuments = [];
        let filteredDocuments = [];
        
        function formatDate(dateStr) {
            if (!dateStr) return 'Belirtilmemiş';
            return dateStr.replace(/T.*/, '').replace(/-/g, '.');
        }
        
        function renderDocuments(documents) {
            const grid = document.getElementById('documentsGrid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('noResults');
            
            loading.style.display = 'none';
            
            if (!documents || documents.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.style.display = 'block';
            
            const html = documents.map(doc => `
                <div class="document-card">
                    <div class="document-title">${doc.baslik || doc.Title || doc.title || 'Başlık belirtilmemiş'}</div>
                    <div class="document-meta">
                        ${doc.kanunNo || doc.id || doc.No ? `
                        <div class="meta-item">
                            <span class="meta-label">Döküman No:</span>
                            <span class="meta-value">${doc.kanunNo || doc.id || doc.No || 'Belirtilmemiş'}</span>
                        </div>
                        ` : ''}
                        ${doc.kabulTarihi || doc.tarih || doc.Date ? `
                        <div class="meta-item">
                            <span class="meta-label">Tarih:</span>
                            <span class="meta-value">${formatDate(doc.kabulTarihi || doc.tarih || doc.Date)}</span>
                        </div>
                        ` : ''}
                        ${doc.yazar || doc.hazirlayan || doc.kurum || doc.Author || doc.Yazar ? `
                        <div class="meta-item">
                            <span class="meta-label">Yazar/Kurum:</span>
                            <span class="meta-value">${doc.yazar || doc.hazirlayan || doc.kurum || doc.Author || doc.Yazar || 'Belirtilmemiş'}</span>
                        </div>
                        ` : ''}
                        ${doc.rgSayi || doc['RG Sayı'] ? `
                        <div class="meta-item">
                            <span class="meta-label">RG Sayısı:</span>
                            <span class="meta-value">${doc.rgSayi || doc['RG Sayı'] || 'Belirtilmemiş'}</span>
                        </div>
                        ` : ''}
                    </div>
                    ${doc.amac || doc.enerji || doc.cevre || doc.Amaç ? `
                    <div class="document-purpose">
                        <strong>Amaç ve Kapsam:</strong><br>
                        ${doc.amac || doc.enerji || doc.cevre || doc.Amaç}
                    </div>
                    ` : ''}
                    ${doc.erisimLinki || doc.Link || doc.link ? `
                        <a href="${doc.erisimLinki || doc.Link || doc.link}" target="_blank" class="access-link">
                            Belgeye Erişim
                        </a>
                    ` : ''}
                </div>
            `).join('');
            
            grid.innerHTML = html;
        }
        
        function categorizeDocument(doc) {
            const title = (doc.baslik || doc.Title || doc.title || '').toLowerCase();
            const purpose = (doc.amac || doc.enerji || doc.cevre || '').toLowerCase();
            const content = title + ' ' + purpose;
            
            if (content.includes('elektrik') || content.includes('enerji') || content.includes('güç')) {
                return 'Enerji ve Elektrik';
            }
            if (content.includes('maden') || content.includes('petrol') || content.includes('gaz')) {
                return 'Maden ve Petrol';
            }
            if (content.includes('bank') || content.includes('finans') || content.includes('kredi')) {
                return 'Finansal Kurumlar';
            }
            if (content.includes('teşkilat') || content.includes('kurul') || content.includes('müdürlük')) {
                return 'Kurumsal Yapı';
            }
            if (content.includes('belediye') || content.includes('şehir') || content.includes('kent')) {
                return 'Yerel Yönetim';
            }
            if (content.includes('vergi') || content.includes('resim') || content.includes('harç')) {
                return 'Mali Hükümler';
            }
            if (content.includes('strateji') || content.includes('plan') || content.includes('kalkınma')) {
                return 'Planlama ve Strateji';
            }
            if (content.includes('çevre') || content.includes('environment')) {
                return 'Çevre';
            }
            return 'Genel Mevzuat';
        }
        
        function populateCategoryFilter() {
            const categories = [...new Set(allDocuments.map(doc => categorizeDocument(doc)))].sort();
            const select = document.getElementById('categoryFilter');
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        }
        
        function filterDocuments() {
            const searchQuery = document.getElementById('searchBox').value.toLowerCase();
            const yearFilter = document.getElementById('yearFilter').value.trim();
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            filteredDocuments = allDocuments.filter(doc => {
                // Search filter
                if (searchQuery) {
                    const searchText = Object.values(doc).join(' ').toLowerCase();
                    if (!searchText.includes(searchQuery)) return false;
                }
                
                // Year filter
                if (yearFilter) {
                    const docYear = extractYear(doc.kabulTarihi || doc.tarih || doc.Date);
                    if (docYear) {
                        if (yearFilter.includes('-')) {
                            const [startYear, endYear] = yearFilter.split('-').map(y => parseInt(y.trim()));
                            if (!isNaN(startYear) && !isNaN(endYear)) {
                                if (docYear < startYear || docYear > endYear) return false;
                            }
                        } else {
                            const filterYear = parseInt(yearFilter);
                            if (!isNaN(filterYear) && docYear !== filterYear) return false;
                        }
                    }
                }
                
                // Category filter
                if (categoryFilter) {
                    const docCategory = categorizeDocument(doc);
                    if (docCategory !== categoryFilter) return false;
                }
                
                return true;
            });
            
            renderDocuments(filteredDocuments);
            updateStats();
        }
        
        function extractYear(dateStr) {
            if (!dateStr) return null;
            const year = parseInt(dateStr.split('.')[2] || dateStr.split('-')[0] || dateStr.split('/')[2]);
            return isNaN(year) ? null : year;
        }
        
        function updateStats() {
            const totalCount = document.getElementById('totalCount');
            const filteredCount = document.getElementById('filteredCount');
            const dateRange = document.getElementById('dateRange');
            
            totalCount.textContent = `Toplam ${allDocuments.length} belge`;
            filteredCount.textContent = `${filteredDocuments.length} gösteriliyor`;
            
            const years = allDocuments.map(doc => extractYear(doc.kabulTarihi || doc.tarih || doc.Date)).filter(y => y);
            if (years.length > 0) {
                const minYear = Math.min(...years);
                const maxYear = Math.max(...years);
                dateRange.textContent = `${minYear} - ${maxYear}`;
            }
        }
        
        function exportData() {
            if (filteredDocuments.length === 0) {
                alert('İndirilecek veri yok.');
                return;
            }
            
            const headers = ['Başlık', 'Döküman No', 'Tarih', 'Yazar/Kurum', 'RG Sayısı', 'Amaç', 'Erişim Linki'];
            const csvContent = [
                headers.join(','),
                ...filteredDocuments.map(doc => 
                    [
                        `"${(doc.baslik || doc.Title || doc.title || '').replace(/"/g, '""')}"`,
                        `"${(doc.kanunNo || doc.id || doc.No || '').replace(/"/g, '""')}"`,
                        `"${formatDate(doc.kabulTarihi || doc.tarih || doc.Date || '').replace(/"/g, '""')}"`,
                        `"${(doc.yazar || doc.hazirlayan || doc.kurum || doc.Author || doc.Yazar || '').replace(/"/g, '""')}"`,
                        `"${(doc.rgSayi || doc['RG Sayı'] || '').replace(/"/g, '""')}"`,
                        `"${(doc.amac || doc.enerji || doc.cevre || doc.Amaç || '').replace(/"/g, '""')}"`,
                        `"${(doc.erisimLinki || doc.Link || doc.link || '').replace(/"/g, '""')}"`
                    ].join(',')
                )
            ].join('\n');
            
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'AB İlerleme Raporları_documents.csv';
            link.click();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            try {
                if (typeof embeddedData !== 'undefined') {
                    allDocuments = embeddedData;
                    filteredDocuments = [...allDocuments];
                    populateCategoryFilter();
                    renderDocuments(filteredDocuments);
                    updateStats();
                    
                    document.getElementById('searchBox').addEventListener('input', filterDocuments);
                    document.getElementById('yearFilter').addEventListener('input', filterDocuments);
                    document.getElementById('categoryFilter').addEventListener('change', filterDocuments);
                } else {
                    document.getElementById('loading').textContent = 'Veri yüklenirken hata oluştu.';
                }
            } catch (error) {
                console.error('Error during initialization:', error);
                document.getElementById('loading').textContent = 'Veri yüklenirken hata oluştu.';
            }
        });
    </script>
