<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sektörel Enerji Tüketimi Dağılımı (1923-2023)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
    <style>
        * { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            padding: 20px;
            background: white;
            color: #333; 
            line-height: 1.6;
        }
        
        .main-container {
            max-width: 1600px;
            width: 95%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
        }
        
        .header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .content-layout {
            display: flex;
            gap: 0;
        }
        
        .filters-panel {
            width: 350px;
            background: #f8f9fa;
            padding: 2rem;
            border-right: 1px solid #e9ecef;
        }
        
        .content-panel {
            flex: 1;
            padding: 2rem;
            min-width: 0;
        }
        
        .filter-group {
            margin-bottom: 2rem;
        }
        
        .filter-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: #006400;
            font-size: 1rem;
        }
        
        .year-range-container {
            margin: 1.5rem 0;
        }
        
        .year-inputs {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }
        
        .year-inputs input {
            width: 80px;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
        }
        
        .year-inputs span {
            color: #666;
            font-weight: 500;
        }
        
        #yearRangeSlider {
            margin: 1.5rem 0;
        }
        
        #yearRangeSlider .noUi-connect {
            background: #006400;
        }
        
        #yearRangeSlider .noUi-handle {
            border-color: #006400;
            background: #fff;
        }
        
        .series-checkboxes {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: white;
            margin-bottom: 1.5rem;
        }
        
        .checkbox-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #006400;
            transform: scale(1.1);
        }
        
        .checkbox-item:hover {
            background: #f8f9fa;
        }
        
        .checkbox-item:last-child {
            border-bottom: none;
        }
        
        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .filter-buttons button {
            flex: 1;
            padding: 0.7rem;
            background: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .filter-buttons button:hover {
            background: #006400;
            color: white;
            border-color: #006400;
        }
        
        .search-input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
        }
        
        .tab-button {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-button:hover {
            color: #006400;
            background: #f8f9fa;
        }
        
        .tab-button.active {
            color: #006400;
            border-bottom-color: #006400;
            background: #f8f9fa;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chart-container {
            position: relative;
            height: 500px;
            margin: 1.5rem 0;
            background: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            background: white;
            scrollbar-width: thin;
            scrollbar-color: #006400 #f1f1f1;
        }
        
        .table-container::-webkit-scrollbar {
            height: 12px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: #006400;
            border-radius: 6px;
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #004d00;
        }
        
        .top-scrollbar-container {
            width: 100%;
            height: 12px;
            margin-bottom: 5px;
            overflow: hidden;
            border-radius: 6px;
            background: #f1f1f1;
        }
        
        .top-scrollbar {
            width: 100%;
            height: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #006400 #f1f1f1;
        }
        
        .top-scrollbar::-webkit-scrollbar {
            height: 12px;
        }
        
        .top-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }
        
        .top-scrollbar::-webkit-scrollbar-thumb {
            background: #006400;
            border-radius: 6px;
        }
        
        .top-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #004d00;
        }
        
        .top-scrollbar-thumb {
            height: 1px;
            background: transparent;
        }

        .data-table {
            border-collapse: collapse;
            min-width: 2500px;
            background: white;
        }
        
        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        
        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #006400;
        }
        
        .data-table tbody tr:nth-child(odd) {
            background: #fbfcfd;
        }
        
        .data-table tbody tr:hover {
            background: #f0f8f0;
        }
        
        /* Category group separation in tables */
        .table-group-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%) !important;
            font-weight: bold;
            color: #006400;
            font-size: 0.9rem;
            border-top: 2px solid #006400;
            border-bottom: 1px solid #dee2e6;
        }
        
        .table-group-header .sticky-col {
            background: linear-gradient(135deg, #f0f8f0 0%, #e8f5e8 100%) !important;
            font-style: italic;
            text-align: left !important;
            font-weight: bold;
            color: #006400;
            border-right: 1px solid #dee2e6;
        }
        
        .table-group-header td:not(.sticky-col) {
            background: #f8f9fa !important;
        }
        
        .table-category-item {
            border-left: 3px solid transparent;
        }
        
        .table-category-item.electricity-supply {
            border-left-color: #17a2b8;
        }
        
        .table-category-item.transformation {
            border-left-color: #fd7e14;
        }
        
        .table-category-item.industry {
            border-left-color: #dc3545;
        }
        
        .table-category-item.transport {
            border-left-color: #6f42c1;
        }
        
        .table-category-item.other-sectors {
            border-left-color: #28a745;
        }
        
        .table-category-item.totals {
            border-left-color: #343a40;
            background: #f8f9fa;
            font-weight: 500;
        }
        
        .sticky-col {
            position: sticky;
            left: 0;
            background: #f8f9fa;
            z-index: 2;
            box-shadow: 2px 0 4px rgba(0,0,0,0.1);
            width: 250px;
            max-width: 250px;
            min-width: 250px;
        }
        
        .red-value {
            color: #dc3545;
            font-style: italic;
        }
        
        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }
        
        .download-buttons button {
            padding: 0.8rem 1.2rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0,100,0,0.2);
        }
        
        .download-buttons button:hover {
            background: #004d00;
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(0,100,0,0.3);
        }

        .chart-download {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }

        .chart-download button {
            padding: 0.8rem 1.5rem;
            background: #006400;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0,100,0,0.2);
        }

        .chart-download button:hover {
            background: #004d00;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,100,0,0.3);
        }
        
        .calculation-mode {
            margin: 1rem 0;
            padding: 1rem;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .calculation-mode label:first-child {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #006400;
            margin-bottom: 0.8rem;
            text-align: center;
        }
        
        .mode-options {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .mode-options label {
            padding: 0.5rem 1rem;
            margin: 0;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #006400;
            background: white;
            border: 2px solid #006400;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0,100,0,0.1);
            min-width: 80px;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
        }
        
        .mode-options label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,100,0,0.2);
            background: #f0f8f0;
        }
        
        .mode-options input[type="radio"] {
            display: none;
        }
        
        .mode-options input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,100,0,0.3);
        }
        

        
        .no-data-message {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        .century-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 1rem;
        }
        
        .factory-icon {
            display: inline-block;
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .content-layout {
                flex-direction: column;
            }
            
            .filters-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .year-inputs {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .download-buttons {
                flex-direction: column;
            }
        }

        /* Hierarchical category styling */
        .category-group {
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fafafa;
        }

        .category-group-header {
            background: #f0f0f0;
            padding: 12px 15px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            display: flex;
            justify-content: between;
            align-items: center;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }

        .category-group-header:hover {
            background: #e8e8e8;
        }

        .category-group-toggle {
            font-size: 12px;
            color: #666;
            margin-left: auto;
        }

        .category-group-content {
            padding: 15px;
            display: block;
        }

        .category-group-content.collapsed {
            display: none;
        }

        .parent-category {
            font-weight: bold;
            color: #2c5aa0;
            margin-bottom: 8px;
        }

        .sub-category {
            margin-left: 20px;
            font-size: 14px;
            color: #555;
        }

        .sub-category input[type="checkbox"] {
            transform: scale(0.9);
            accent-color: #006400;
        }

        .category-total {
            font-weight: bold;
            color: #d63384;
            background: #fff5f5;
            padding: 4px 8px;
            border-radius: 3px;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Sektörel Enerji Tüketimi Dağılımı (1923-2023)</h1>
        </div>
        
        <div class="content-layout">
            <div class="filters-panel">
                <div class="filter-group">
                    <label>Yıl Aralığı</label>
                    <div class="year-range-container">
                        <div id="yearRangeSlider"></div>
                        <div class="year-inputs">
                            <input type="number" id="yearInputStart" min="1923" max="2023" value="1923">
                            <span>-</span>
                            <input type="number" id="yearInputEnd" min="1923" max="2023" value="2023">
                        </div>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label>Sektörler ve Kategoriler</label>
                    <input type="text" id="seriesSearch" class="search-input" placeholder="Sektör ara...">
                    <div class="filter-buttons">
                        <button id="selectAllBtn">Hepsini Seç</button>
                        <button id="deselectAllBtn">Hiçbirini Seçme</button>
                    </div>
                    <div id="seriesCheckboxes" class="series-checkboxes"></div>
                    
                    <div class="download-buttons">
                        <button id="downloadFullData">Tam Veriyi İndir</button>
                        <button id="downloadFilteredData">Filtrelenmiş Veriyi İndir</button>
                    </div>
                </div>
            </div>
            
            <div class="content-panel">
                <div class="tabs">
                    <button class="tab-button active" data-tab="table">Tablo</button>
                    <button class="tab-button" data-tab="line">Çizgi Grafik</button>
                    <button class="tab-button" data-tab="bar">Sütun Grafik</button>
                    <button class="tab-button" data-tab="pie">Pasta Grafik</button>
                </div>
                
                <div id="tableContent" class="tab-content active">
                    <div class="top-scrollbar-container">
                        <div class="top-scrollbar">
                            <div class="top-scrollbar-thumb"></div>
                        </div>
                    </div>
                    <div class="table-container" id="mainTableContainer">
                        <div id="tableContainer"></div>
                    </div>
                </div>
                
                <div id="lineContent" class="tab-content">
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                    <div class="chart-download">
                        <button id="downloadLineChart">Çizgi Grafiği İndir</button>
                    </div>
                </div>
                
                <div id="barContent" class="tab-content">
                    <div class="calculation-mode">
                        <label>Hesaplama Türü</label>
                        <div class="mode-options">
                            <input type="radio" id="mode-sum" name="barChartMode" value="sum" checked>
                            <label for="mode-sum">Toplam</label>
                            <input type="radio" id="mode-average" name="barChartMode" value="average">
                            <label for="mode-average">Ortalama</label>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                    <div class="chart-download">
                        <button id="downloadBarChart">Sütun Grafiği İndir</button>
                    </div>
                </div>
                
                <div id="pieContent" class="tab-content">
                    <div class="calculation-mode">
                        <label>Hesaplama Türü</label>
                        <div class="mode-options">
                            <input type="radio" id="pie-mode-sum" name="pieChartMode" value="sum" checked>
                            <label for="pie-mode-sum">Toplam</label>
                            <input type="radio" id="pie-mode-average" name="pieChartMode" value="average">
                            <label for="pie-mode-average">Ortalama</label>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div class="chart-download">
                        <button id="downloadPieChart">Pasta Grafiği İndir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Embedded data -->
    <script src="data/C/c_embedded_data.js"></script>

    <script>
        // Global variables
        let yearSlider = null;
        let lineChart = null;
        let barChart = null;
        let pieChart = null;
        let currentFilteredData = [];
        let allYears = [];
        let colorIndex = 0;
        let startYear = 1923;
        let endYear = 2023;

        // Diverse color palette for sectoral consumption
        const materialColors = [
            '#F44336', '#2196F3', '#4CAF50', '#FF9800', '#9C27B0',
            '#00BCD4', '#CDDC39', '#FF5722', '#795548', '#607D8B',
            '#E91E63', '#3F51B5', '#009688', '#8BC34A', '#FFC107',
            '#673AB7', '#00E676', '#FF6D00', '#37474F', '#B71C1C',
            '#E53935', '#1E88E5', '#43A047', '#FB8C00', '#8E24AA',
            '#26A69A', '#D4E157', '#FF3D00', '#6D4C41', '#546E7A',
            '#AD1457', '#5E35B1', '#00ACC1', '#7CB342', '#FFB300',
            '#512DA8', '#66BB6A', '#FF8F00', '#D32F2F', '#7B1FA2'
        ];

        function getNextMaterialColor() {
            const color = materialColors[colorIndex % materialColors.length];
            colorIndex++;
            return color;
        }

        function parseRedValue(value) {
            if (value === null || value === undefined) return null;
            if (typeof value === 'string' && value.startsWith('(') && value.endsWith(')')) {
                const numStr = value.slice(1, -1);
                return parseFloat(numStr) || 0;
            }
            return parseFloat(value) || 0;
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', function() {
            // Use embeddedRawData from the included script file (Dataset C)
            const data = typeof embeddedRawData !== 'undefined' ? embeddedRawData : [];
            
            if (data.length === 0) {
                showNoDataMessage();
                return;
            }

            console.log('Loaded', data.length, 'data series for Sectoral Consumption');
            
            // Extract all years from data
            allYears = [];
            data.forEach(item => {
                Object.keys(item).forEach(key => {
                    if (key !== 'category' && !isNaN(parseInt(key))) {
                        const year = parseInt(key);
                        if (!allYears.includes(year)) {
                            allYears.push(year);
                        }
                    }
                });
            });
            allYears.sort((a, b) => a - b);
            
            if (allYears.length > 0) {
                startYear = allYears[0];
                endYear = allYears[allYears.length - 1];
            }

            initializeFilters();
            initializeEventListeners();
            populateSeriesCheckboxes(data);
            applyFiltersAndRender();
        });

        function showNoDataMessage() {
            document.querySelector('.content-panel').innerHTML = `
                <div class="no-data-message">
                    <h3>⚠️ Veri Yüklenemedi</h3>
                    <p>Sektörel tüketim verileri yüklenemedi. Lütfen data/C/c_embedded_data.js dosyasının mevcut olduğunu kontrol edin.</p>
                </div>
            `;
        }

        function initializeFilters() {
            // Initialize year range slider
            const yearRangeSlider = document.getElementById('yearRangeSlider');
            
            noUiSlider.create(yearRangeSlider, {
                start: [startYear, endYear],
                connect: true,
                range: {
                    'min': allYears[0] || 1923,
                    'max': allYears[allYears.length - 1] || 2023
                },
                step: 1,
                format: {
                    to: function(value) {
                        return Math.round(value);
                    },
                    from: function(value) {
                        return Number(value);
                    }
                }
            });

            // Update inputs when slider changes
            yearRangeSlider.noUiSlider.on('update', function(values) {
                startYear = parseInt(values[0]);
                endYear = parseInt(values[1]);
                document.getElementById('yearInputStart').value = startYear;
                document.getElementById('yearInputEnd').value = endYear;
            });

            // Apply filters when slider stops moving
            yearRangeSlider.noUiSlider.on('set', function() {
                applyFiltersAndRender();
            });

            yearSlider = yearRangeSlider;
        }

        function initializeEventListeners() {
            // Year input changes
            document.getElementById('yearInputStart').addEventListener('change', handleYearInputChange);
            document.getElementById('yearInputEnd').addEventListener('change', handleYearInputChange);

            // Tab switching
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });

            // Filter buttons
            document.getElementById('selectAllBtn').addEventListener('click', function() {

        function downloadData(type) {
            let data, filename;
            
            if (type === 'full') {
                const allData = typeof embeddedRawData !== 'undefined' ? embeddedRawData : [];
                data = convertToCSV(allData, allYears);
                filename = 'sektorel_tuketim_tam_veri.csv';
            } else {
                if (currentFilteredData.length === 0) {
                    alert('İndirilecek filtrelenmiş veri yok.');
                    return;
                }
                const yearsInRange = allYears.filter(year => year >= startYear && year <= endYear);
                data = convertToCSV(currentFilteredData, yearsInRange);
                filename = `sektorel_tuketim_filtreli_${startYear}_${endYear}.csv`;
            }
            
            triggerDownload(data, filename);
        }

        function convertToCSV(data, years) {
            const headers = ['Kategori', ...years.map(String)];
            const rows = [headers];
            
            data.forEach(item => {
                const row = [item.category];
                years.forEach(year => {
                    let value = item[year];
                    if (value === null || value === undefined) {
                        value = '';
                    }
                    row.push(value);
                });
                rows.push(row);
            });
            
            return rows.map(row => 
                row.map(cell => {
                    const str = String(cell);
                    return str.includes(',') ? `"${str}"` : str;
                }).join(',')
            ).join('\r\n');
        }

        function triggerDownload(csvData, filename) {
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function createProfessionalChartImage(chartCanvas, filename, chartType) {
            // Create a larger canvas for the professional layout
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');
            
            // Set canvas dimensions (similar to Our World in Data)
            const width = 1200;
            const height = 800;
            exportCanvas.width = width;
            exportCanvas.height = height;
            
            // Fill with white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // Load and draw logo
            const logo = new Image();
            logo.crossOrigin = 'anonymous';
            logo.onload = function() {
                // High-quality logo rendering with preserved aspect ratio
                const maxLogoSize = 150;
                const logoAspectRatio = 1.500;
                const logoMargin = 25; // Increased margin for better positioning
                
                let logoWidth, logoHeight;
                if (logoAspectRatio > 1) {
                    // Wide logo (landscape)
                    logoWidth = maxLogoSize;
                    logoHeight = maxLogoSize / logoAspectRatio;
                } else {
                    // Tall logo (portrait)
                    logoHeight = maxLogoSize;
                    logoWidth = maxLogoSize * logoAspectRatio;
                }
                
                // Enable high-quality rendering
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                // Calculate position (top-right with better spacing)
                const logoX = width - logoWidth - logoMargin;
                const logoY = logoMargin;
                
                // Draw logo with high quality
                ctx.drawImage(logo, logoX, logoY, logoWidth, logoHeight);
                
                // Optional: Add subtle drop shadow for better visibility
                ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                // Reset shadow for subsequent drawing
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                // Continue with rest of the drawing
                drawChartContent();
            };;
            ;
            
            logo.onerror = function() {
                // If logo fails to load, continue without it
                console.warn('Logo could not be loaded, continuing without it');
                drawChartContent();

            function drawChartContent() {
                // Set up typography
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                
                // Main title
                ctx.fillStyle = '#333333';
                ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
                const mainTitle = getChartTitle(chartType);
                ctx.fillText(mainTitle, 40, 30);
                
                // Subtitle with data info
                ctx.fillStyle = '#666666';
                ctx.font = '16px "Segoe UI", Arial, sans-serif';
                const subtitle = getChartSubtitle(chartType);
                ctx.fillText(subtitle, 40, 70);
                
                // Data source and period
                ctx.fillStyle = '#888888';
                ctx.font = '14px "Segoe UI", Arial, sans-serif';
                const dataInfo = `Dönem: ${startYear}-${endYear} | Veri Kaynakı: Türkiye'nin Enerji Geleceği (1923-2123)`;
                ctx.fillText(dataInfo, 40, 100);
                
                // Draw the main chart
                const chartAreaTop = 140;
                const chartAreaHeight = height - chartAreaTop - 100;
                const chartAreaWidth = width - 80;
                
                // Create a temporary canvas to scale the original chart
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = chartAreaWidth;
                tempCanvas.height = chartAreaHeight;
                
                // Fill temp canvas with white background
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillRect(0, 0, chartAreaWidth, chartAreaHeight);
                
                // Draw the original chart scaled to fit
                tempCtx.drawImage(chartCanvas, 0, 0, chartAreaWidth, chartAreaHeight);
                
                // Draw the scaled chart onto main canvas
                ctx.drawImage(tempCanvas, 40, chartAreaTop);
                
                // Add footer with website info
                ctx.fillStyle = '#999999';
                ctx.font = '12px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('Türkiye Enerji Veri Platformu', width - 40, height - 30);
                
                // Add border around chart area
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 1;
                ctx.strokeRect(40, chartAreaTop, chartAreaWidth, chartAreaHeight);
                
                // Download the final image
                exportCanvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                }, 'image/png');
            }
        }

        function getChartTitle(chartType) {
            const baseTitle = 'Türkiye Sektörel Enerji Tüketimi';
            switch(chartType) {
                case 'lineChart':
                    return `${baseTitle} - Zaman Serisi Analizi`;
                case 'barChart':
                    const barMode = document.querySelector('input[name="barChartMode"]:checked').value;
                    return `${baseTitle} - ${barMode === 'sum' ? 'Toplam' : 'Ortalama'} Değerler`;
                case 'pieChart':
                    const pieMode = document.querySelector('input[name="pieChartMode"]:checked').value;
                    return `${baseTitle} - Sektör Dağılımı (${pieMode === 'sum' ? 'Toplam' : 'Ortalama'})`;
                default:
                    return baseTitle;
            }
        }

        function getChartSubtitle(chartType) {
            const selectedCount = document.querySelectorAll('#seriesCheckboxes input[type="checkbox"]:checked').length;
            switch(chartType) {
                case 'lineChart':
                    return `${selectedCount} sektör için yıllık değişim trendi (GWh)`;
                case 'barChart':
                    return `${selectedCount} sektör için karşılaştırmalı analiz (GWh)`;
                case 'pieChart':
                    return `${selectedCount} sektör için oransal dağılım analizi (GWh)`;
                default:
                    return `Sektörel elektrik tüketim verileri (GWh)`;
            }
        }

        // Turkish number formatting functions
        function formatTableNumber(value) {
            if (value === null || value === undefined || value === '') return 'N/A';
            return parseFloat(value).toFixed(1);
        }

        function formatGraphNumber(value) {
            if (value === null || value === undefined || value === '') return 'N/A';
            return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }
